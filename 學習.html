t of Cranium；Table 8.3 Muscles of Scalp and Face；Paranasal Sinuses: Frontal Sinuses）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "Walker PL. Am J Phys Anthropol 2008;136:39–50（DOI 10.1002/ajpa.20776；摘要經 Europe PMC API 讀取）"]}, "ns": {"zh": "鼻棘點", "en": "nasospinale", "abbr": "ns", "bilateral": false, "region": "顏面・鼻", "bones": ["上頷骨"], "definition": "梨狀孔（piriform aperture）下緣與正中矢狀面的交點；較精確的說法是：切過左右梨狀孔下緣的連線與正中面的交點。", "howToFind": "正面看梨狀孔，在左右下緣最低處拉一條水平切線，取它和正中線的交點；再轉側面確認沒有點到往前突的前鼻棘（anterior nasal spine）尖端。", "anatomy": "梨狀孔是頭骨的前鼻孔，大部分由左右上頷骨圍成，上方是鼻骨，從孔內可看到骨性鼻中隔（Moore）。Moore 用一條大約通過前鼻棘與蝶篩隱窩的斜線劃分鼻黏膜的神經：後下部主要是 V2，前上部是 V1。", "clinical": "鼻高（n–ns）與鼻寬（al–al）組成鼻指數（鼻寬×100÷鼻高；窄鼻 <48、中鼻 48–52.99、寬鼻 ≥53），是人類學描述鼻孔形態的指標（Yuan）。", "examPoints": [], "pitfalls": "不要點在前鼻棘尖端——定義是下緣切線與正中面的交點。梨狀孔下緣左右不對稱或骨緣破損時，用兩側最低點決定切線（CoRA：鼻高量到梨狀孔下緣最低點的平均高度）。", "relatedMeasurements": ["Martin 55 鼻高（n–ns）", "鼻指數（鼻寬×100÷鼻高；Yuan）"], "sources": ["https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://www.iitg.ac.in/cseweb/vlab/anthropology/Theory_indices.html（IIT Guwahati 人類學虛擬實驗室）", "https://docs.coracore.org/en/latest/forensics-anthro-guide/measurements/（CoRA，依 DCP 2.0）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8 Head；Anterior Aspect of Cranium；Vasculature and Innervation of Nose, Fig. 8.108）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003：鼻指數）"]}, "pr": {"zh": "上齒槽前點", "en": "prosthion", "abbr": "pr", "bilateral": false, "region": "顏面・上頷", "bones": ["上頷骨"], "definition": "兩顆上中門齒之間，上頷齒槽突（alveolar process）前緣的正中點。", "howToFind": "正面放大上門齒區，找兩顆上中門齒之間的齒槽骨中隔，取它前緣最靠咬合面的正中點；再轉側面確認點在齒槽骨上，不在牙齒上。", "anatomy": "左右上頷骨在正中以上頷間縫相接，齒槽突含牙窩、支持上顎牙齒（Moore）；IIT 的定義把 pr 放在上頷間縫的齒槽端、兩顆中門齒之間。", "clinical": "拔牙或缺牙後齒槽骨會吸收，全口缺牙會讓垂直面高變小（Moore），所以缺牙頭骨的 pr 不可靠。", "examPoints": [], "pitfalls": "缺牙、缺上中門齒或齒槽吸收的頭骨不要硬標（Skeleton·ID）。Hall 教材量上面高用 alveolare（上中門齒間的骨嵴），與 prosthion 名稱不同，比對資料時要看清楚用的是哪一個。", "relatedMeasurements": ["Martin 48 上面高（n–pr）", "ba–pr 長（CoRA/DCP 2.0；未列 Martin 編號）"], "sources": ["https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "https://www.iitg.ac.in/cseweb/vlab/anthropology/Theory_indices.html（IIT Guwahati）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8 Head；Anterior Aspect of Cranium；Clinical Box: Resorption of Alveolar Bone）", "https://docs.coracore.org/en/latest/forensics-anthro-guide/measurements/（CoRA）"]}, "b": {"zh": "前囟點", "en": "bregma", "abbr": "b", "bilateral": false, "region": "顱頂", "bones": ["額骨", "頂骨"], "definition": "矢狀縫與冠狀縫在顱頂正中的交點。", "howToFind": "從正上方看顱頂，開著貼圖沿左右頂骨之間的矢狀縫往前，找它和橫走的冠狀縫的交點。骨縫模糊或已癒合時，依兩條縫的整體走向外推交點（Skeleton·ID）。", "anatomy": "冠狀縫分隔額骨與頂骨，矢狀縫分隔左右頂骨（Moore）。新生兒的前囟位在矢狀縫、冠狀縫與額縫交會處，就是日後的 bregma；前囟最大、呈菱形，18 個月大時已摸不到（Moore）。顱頂最高點 vertex 在矢狀縫中點附近，不是 bregma（Moore）。成人骨縫約 30–40 歲由內面開始癒合、外面約晚 10 年，通常從 bregma 開始，再依序矢狀縫、冠狀縫、人字縫，個體差異大（Moore）。", "clinical": "嬰兒觸診前囟：凹陷提示脫水，膨出提示顱內壓上升（Moore）。矢狀縫早閉→長而窄的舟狀頭；冠狀縫早閉→塔狀頭（Moore）。Radiopaedia 則把雙側冠狀縫早閉寫成短頭（brachycephaly），教材說法不一。", "examPoints": [], "pitfalls": "還有前囟的幼兒頭骨、或骨縫完全癒合的成人頭骨，都無法精確定 b（Skeleton·ID）。b 在顱蓋上，顱蓋鋸開過時，它和顱底點（如 ba）的距離會吃進顱蓋裝回的誤差。", "relatedMeasurements": ["Martin 17 顱高（ba–b，部分查證）"], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8 Head；Table 8.1 Craniometric Points of Cranium；Superior Aspect of Cranium, Fig. 8.8；Clinical Box: Development of Cranium；Clinical Box: Obliteration of Cranial Sutures；Clinical Box: Craniosynostosis and Cranial Malformations, Fig. B8.11）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://radiopaedia.org/articles/craniosynostosis（Radiopaedia：雙側冠狀縫早閉→短頭）"]}, "l": {"zh": "人字點", "en": "lambda", "abbr": "l", "bilateral": false, "region": "枕部", "bones": ["頂骨", "枕骨"], "definition": "矢狀縫與人字縫（lambdoid suture）的交點。", "howToFind": "從後面（枕面）看，沿矢狀縫往後，找它和左右兩支人字縫會合的「人」字頂點。有縫間骨時，依矢狀縫與人字縫的主要走向外推交點（Skeleton·ID）。", "anatomy": "人字縫把頂骨、顳骨與枕骨分開（Moore）。新生兒的後囟位在人字縫與矢狀縫交會處，就是日後的 lambda；後囟呈三角形，出生後幾個月開始閉合，1 歲時已摸不到（Moore）。縫間骨（wormian bones）常出現在 lambda 或乳突附近（Moore）。", "clinical": "活人身上 lambda 有時可摸到一個凹陷（Moore）。單側冠狀縫或人字縫早閉會使頭顱扭曲、不對稱（plagiocephaly）（Moore）。", "examPoints": [], "pitfalls": "縫間骨多時，容易把某塊小骨的角當成 lambda。lambda 在顱蓋上，顱蓋鋸開過時要注意裝回誤差。", "relatedMeasurements": [], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8 Head；Table 8.1 Craniometric Points of Cranium；Occipital Aspect of Cranium, Fig. 8.7；Superior Aspect of Cranium；Clinical Box: Development of Cranium；Clinical Box: Craniosynostosis and Cranial Malformations, Fig. B8.11）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）"]}, "op": {"zh": "顱後點", "en": "opisthocranion", "abbr": "op", "bilateral": false, "region": "枕部", "bones": ["枕骨"], "definition": "從眉間點量起、顱骨正中最後方的點，也就是最大顱長的後端點；不取在枕外隆凸上。", "howToFind": "先擺正，從側面看正中輪廓，找離 g 最遠的枕部點。Yuan 講義說這個點是用儀器（卡尺）決定的，在 3D 上可以用量測工具沿正中線找 g–op 的最大值。Skeleton·ID 指出它幾乎都落在枕骨上鱗（枕外隆凸上方）。", "anatomy": "後腦勺的凸起（occiput）是枕骨鱗部向後的隆起；枕外隆凸位在正中線上，上項線從它向兩側延伸（Moore）。", "clinical": "矢狀縫早閉的舟狀頭長而窄（Moore）。g–op 也是 Giles 1970 頭骨性別判別式的變數之一（Yuan 講義轉引）。", "examPoints": [], "pitfalls": "枕外隆凸特別突出時，最後方的點可能落在隆凸上——Hall、Yuan、IIT 的定義都要排除；Skeleton·ID 則提到偶爾會落在隆凸上，研究要寫明採哪一版。極值點要先擺正；顱蓋鋸開線可能經過 op。", "relatedMeasurements": ["Martin 1 最大顱長（g–op）", "顱指數（Martin 8÷Martin 1×100）"], "sources": ["https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://www.iitg.ac.in/cseweb/vlab/anthropology/Theory_indices.html（IIT Guwahati）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8 Head；Occipital Aspect of Cranium, Fig. 8.7；Clinical Box: Craniosynostosis and Cranial Malformations, Fig. B8.11）"]}, "ba": {"zh": "顱底點", "en": "basion", "abbr": "ba", "bilateral": false, "region": "顱底", "bones": ["枕骨"], "definition": "枕骨大孔（foramen magnum）前緣的正中點。", "howToFind": "把頭骨翻到顱底視角，先找枕骨大孔：它大約位在兩側乳突之間、和乳突同高（Moore）。取孔前緣的正中點；顱底的掃描品質常較差，要放大確認骨緣（Skeleton·ID）。", "anatomy": "通過枕骨大孔的有：脊髓（在此接延腦）、腦脊膜、椎動脈、前後脊髓動脈、副神經（CN XI）脊髓根（Moore）。大孔兩側是枕髁，與寰椎形成寰枕關節（Moore）。", "clinical": "小腦扁桃體疝經枕骨大孔壓迫延髓，可致猝死（Radiopaedia；MSD Manual）。ba–o 連線即 McRae line，用來評估顱底凹陷與小腦扁桃體位置；basion 到齒突尖的距離（basion–dens interval）用於診斷寰枕脫位，X 光正常 <12 mm、CT <8.5 mm（Radiopaedia）。", "examPoints": [], "pitfalls": "點在大孔「前緣」的正中，不要點到兩側的枕髁上。ba 在顱底、b 在顱蓋，顱蓋鋸開過的標本量 ba–b 會吃進顱蓋裝回的誤差。", "relatedMeasurements": ["Martin 5 顱底長（ba–n）", "Martin 17 顱高（ba–b，部分查證）", "Martin 7 枕骨大孔長（ba–o，部分查證）", "ba–pr 長（CoRA/DCP 2.0；未列 Martin 編號）"], "sources": ["https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8 Head：Fig. 8.9 Adult cranium VII: external cranial base；External Surface of Cranial Base；Ch.2 Back：Craniovertebral Joints）", "https://radiopaedia.org/articles/mcrae-line", "https://radiopaedia.org/articles/basion-dens-interval", "https://docs.coracore.org/en/latest/forensics-anthro-guide/measurements/（CoRA）", "https://radiopaedia.org/articles/tonsillar-herniation（Radiopaedia：小腦扁桃體疝壓迫腦幹）", "https://www.msdmanuals.com/professional/neurologic-disorders/coma-and-impaired-consciousness/brain-herniation（MSD Manual Professional：Brain Herniation）"]}, "o": {"zh": "枕大孔後點", "en": "opisthion", "abbr": "o", "bilateral": false, "region": "顱底", "bones": ["枕骨"], "definition": "枕骨大孔後緣的正中點。", "howToFind": "顱底視角，先標好 ba，再沿正中線往後越過枕骨大孔，在後緣取正中點。Skeleton·ID 建議點在後緣朝向孔內的那一側邊上，掃描品質差時要放大確認。", "anatomy": "枕外嵴從枕外隆凸往下延伸到枕骨大孔（Moore）。項韌帶從枕外隆凸與枕骨大孔後緣向下，附著到頸椎棘突（Moore）。", "clinical": "McRae line（ba–o）用來評估顱底凹陷（齒突尖正常約在線下 5 mm）與小腦扁桃體是否低於枕骨大孔（Radiopaedia）；小腦扁桃體疝經枕骨大孔壓迫延髓（Radiopaedia）。", "examPoints": [], "pitfalls": "不要點到大孔後方的枕外嵴或枕骨鱗部骨面上；掃描破洞時不要硬點（Skeleton·ID：掃描品質明顯影響此區準確度）。", "relatedMeasurements": ["Martin 7 枕骨大孔長（ba–o，部分查證）", "McRae line（ba–o）"], "sources": ["https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.2 Back：Accessory Ligaments of Intervertebral Joints, nuchal ligament；Ch.8 Head：Occipital Aspect of Cranium, Fig. 8.7；External Surface of Cranial Base）", "https://radiopaedia.org/articles/mcrae-line", "https://radiopaedia.org/articles/tonsillar-herniation（Radiopaedia：小腦扁桃體疝壓迫腦幹）"]}, "zy": {"zh": "顴點", "en": "zygion", "abbr": "zy", "bilateral": true, "region": "側面", "bones": ["顴骨", "顳骨"], "definition": "顴弓（zygomatic arch）最外側的點，即顴寬的端點。", "howToFind": "先擺正，從正面或上面看，用垂直於正中面的輔助線找左右顴弓最向外突的點（Skeleton·ID）。Hall、Yuan 都說它是用卡尺量出的極值點，可用量測工具找 zy–zy 的最大距離。", "anatomy": "顴弓由顴骨的顳突與顳骨的顴突相接而成，是顳窩的下界，上緣大約對應大腦半球的下界（Moore）。顳筋膜分兩層附著在顴弓內外面，咬肌附著在顴弓下緣（Moore）。", "clinical": "顴弓—眶外緣是把臼齒區咬合力傳到額骨、顳骨的主要支柱之一；Le Fort III 骨折同時斷顴弓（Moore）。顏面神經顳支跨過顴弓，支配額肌與眼輪匝肌上部（Moore）。zy–zy 也是 Giles 1970 性別判別式的變數（Yuan 轉引）。", "examPoints": [], "pitfalls": "要先擺正再找極值；顴弓細、容易斷，破損時不要硬點。不要和 eu（腦顱最寬處）混淆。", "relatedMeasurements": ["Martin 45 顴寬（zy–zy）", "面指數（全面高×100÷顴寬；Yuan）"], "sources": ["https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v5（Skeleton·ID 手冊：雙側點）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8 Head；Lateral Aspect of Cranium；Walls of Cranial Cavity: buttresses, Fig. 8.13；Clinical Box: Fractures of Maxillae and Associated Bones, Fig. B8.1；Facial Nerve；Temporal Region）"]}, "eu": {"zh": "顱側點", "en": "euryon", "abbr": "eu", "bilateral": true, "region": "側面", "bones": ["頂骨"], "definition": "腦顱（braincase）左右最寬處的兩個端點，即最大顱寬的端點，用卡尺量出來決定。", "howToFind": "先擺正（FH＋正中面），從上面或後面看，找腦顱左右最寬的一對點；Hall 教材的卡尺放在頂骨後部最寬處。可以用量測工具在兩側來回試，找 eu–eu 的最大值。", "anatomy": "顱頂由額骨鱗部、左右頂骨與枕骨鱗部構成，從上面看大致呈卵圓形，在頂結節（parietal eminence）處向後外側變寬（Moore）。", "clinical": "顱指數（Martin 8÷Martin 1×100）描述頭形：長顱、中顱、短顱等（Yuan）。矢狀縫早閉的舟狀頭長而窄（Moore）。eu–eu 也是 Giles 1970 性別判別式的變數（Yuan 轉引）。", "examPoints": [], "pitfalls": "不能落在顴弓上（那是 zy）。CoRA（依 DCP 2.0）量最大顱寬時排除顳下線處。極值點要先擺正；顱蓋鋸開線可能經過 eu。", "relatedMeasurements": ["Martin 8 最大顱寬（eu–eu）", "顱指數（Martin 8÷Martin 1×100）"], "sources": ["https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://www.iitg.ac.in/cseweb/vlab/anthropology/Theory_indices.html（IIT Guwahati）", "https://docs.coracore.org/en/latest/forensics-anthro-guide/measurements/（CoRA，依 DCP 2.0）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8 Head；Superior Aspect of Cranium, Fig. 8.8；Clinical Box: Craniosynostosis and Cranial Malformations, Fig. B8.11）"]}, "ft": {"zh": "額顳點", "en": "frontotemporale", "abbr": "ft", "bilateral": true, "region": "側面", "bones": ["額骨"], "definition": "額骨上顳線（temporal line）最向前內側的點；左右 ft 之間是最小額寬。", "howToFind": "正面看眼眶外上方、額骨轉向顳窩的地方，找顳線往前內彎到最內側（左右距離最窄）的位置，再轉側面確認點在顳線上（Skeleton·ID）。開著貼圖時，顳線這條肌肉附著稜線比較容易看。", "anatomy": "顳窩的上、後界是上、下顳線，前界是額骨與顴骨，下界是顴弓（Moore）。顳筋膜附著在上顳線，顳肌起自顳窩底與顳筋膜（Moore）；顳肌是閉口、後縮的咀嚼肌，由 V3 支配（Moore）。", "clinical": "", "examPoints": [], "pitfalls": "顳線在骨面上是低平的稜線，塑膠模型上可能不明顯。上、下顳線要分清楚，兩側用同一條（Skeleton·ID 手冊取下顳線）。顱蓋鋸開線可能經過 ft。", "relatedMeasurements": ["Martin 9 最小額寬（ft–ft）"], "sources": ["https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v5（Skeleton·ID 手冊：雙側點）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8 Head；Lateral Aspect of Cranium；Temporal Region, Fig. 8.70；Table 8.11 Muscles Acting on Mandible to Produce Movements at Temporomandibular Joint）"]}, "ms": {"zh": "乳突點", "en": "mastoidale", "abbr": "ms", "bilateral": true, "region": "側面", "bones": ["顳骨（乳突部）"], "definition": "乳突（mastoid process）最下方的尖端（傳統定義）。", "howToFind": "先擺正（FH），從側面看外耳道後下方的乳突，取它最低的尖點；再從後面或顱底視角確認。Moore：枕骨大孔大約在兩側乳突之間、和乳突同高，可以互相對照。", "anatomy": "乳突屬顳骨乳突部，內含氣室（Moore；TeachMeAnatomy）；位在外耳道開口後下方，前內側是莖突（Moore）。胸鎖乳突肌止於乳突（Moore）。乳突表面的皮膚由耳大神經（C2–C3）支配（Moore）。", "clinical": "新生兒沒有乳突，顏面神經出莖乳孔時很表淺，難產時的產鉗或耳後切口可能傷到它；乳突在出生後第 1 年隨胸鎖乳突肌發育、拉扯而逐漸形成（Moore）。乳突是頭骨性別目視判讀的五個特徵之一（Walker 2008），po–ms 也用在 Giles 1970 性別判別式（Yuan 轉引）。", "examPoints": [], "pitfalls": "定義不一：Skeleton·ID 手冊（定義引 Caple & Stephan）寫成「乳突切跡（mastoid notch）最後方的點」，和「乳突最低點」（Yuan、標註器定義）不是同一點，研究要寫明採哪一版。沒擺正時「最低點」會偏；乳突尖破損時不要硬點。", "relatedMeasurements": ["乳突長 po–ms（Giles 1970 判別式用；CoRA 稱 mastoid height；未列 Martin 編號）"], "sources": ["https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v5（Skeleton·ID 手冊：雙側點）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Lateral Aspect of Cranium（Fig. 8.4A）、Fig. 8.9、Middle Ear: Walls of Tympanic Cavity（Fig. 8.116A）、Clinical Box: Development of Cranium（Fig. B8.6）；Ch.9；Sternocleidomastoid Region（Table 9.2）、Nerves of Lateral Cervical Region）", "https://teachmeanatomy.info/head/osteology/temporal-bone/（TeachMeAnatomy：顳骨乳突部、乳突氣室）", "Walker PL. Am J Phys Anthropol 2008;136:39–50（DOI 10.1002/ajpa.20776；摘要經 Europe PMC API 讀取）", "https://docs.coracore.org/en/latest/forensics-anthro-guide/measurements/（CoRA）"]}, "d": {"zh": "淚點", "en": "dacryon", "abbr": "d", "bilateral": true, "region": "顏面・眼眶", "bones": ["額骨", "淚骨", "上頷骨"], "definition": "眼眶內側緣上，淚上頷縫（lacrimomaxillary suture）與額骨相交的點，也就是額骨、淚骨、上頷骨三骨交會處。", "howToFind": "正面放大眼眶內側壁前部的淚骨，找淚骨與上頷骨之間的縫往上碰到額骨的點，這裡常有一個小孔可參考。縫看不清楚時，對準淚囊窩的頂端往上延伸到額骨（Skeleton·ID）。", "anatomy": "眼眶內側壁由篩骨眶板、上頷骨額突、淚骨與蝶骨構成，大多薄如紙；前方有淚溝與淚囊窩（Moore）。淚囊經鼻淚管把淚液排到下鼻道（Moore）。淚「腺」則在眼眶外上方的淚腺窩（Moore）。", "clinical": "內側壁很薄，眼球受鈍擊時可能發生 blowout fracture，內側壁骨折會波及篩竇與蝶竇（Moore）。", "examPoints": [], "pitfalls": "不要點在淚囊窩底或眶內深處；淚腺窩（外上）和淚囊窩（內側）別搞混。眶寬的內側起點各書不同：Martin 51a 從 d 量起（CoRA），另有從 maxillofrontale 起算的版本（Simmons-Ehrhardt 2022），比對資料要看起點。", "relatedMeasurements": ["Martin 51a 眶寬（d–ec）", "Martin 52 眶高（與眶寬垂直）", "眶指數（眶高×100÷眶寬；Yuan）"], "sources": ["https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v5（Skeleton·ID 手冊：雙側點）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Orbits（Fig. 8.44B）、Lacrimal Apparatus（Figs. 8.46A、8.47B）、Clinical Box: Fractures of Orbit（Fig. B8.24））", "https://docs.coracore.org/en/latest/forensics-anthro-guide/measurements/（CoRA：orbital breadth d–ec＝Martin 51a、orbital height＝Martin 52）", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9168058/（Simmons-Ehrhardt 2022 Data Brief：眶寬通常以 dacryon 為內側端點，該資料集改用 maxillofrontale）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003：眶指數）"]}, "ec": {"zh": "眶外緣點", "en": "ectoconchion", "abbr": "ec", "bilateral": true, "region": "顏面・眼眶", "bones": ["顴骨"], "definition": "眶外側緣與「橫向平分眼眶的線」的交點，是眶寬的外側端點。", "howToFind": "正面看眼眶，畫一條水平線把眼眶上下平分，這條線和眶外緣的交點就是 ec（Skeleton·ID：水平線平分眼眶、垂直線標外緣）。通常和 d 一起標，因為眶寬 d–ec 由這兩點決定。", "anatomy": "眶的前外側緣由顴骨構成；眶外側壁由顴骨額突與蝶骨大翼構成，是四壁中最厚、最強的一面（Moore）。", "clinical": "顴弓—眶外緣是傳遞咬合力的主要支柱之一；Le Fort III 骨折經過額顴縫（Moore）。直接撞擊眶緣時，骨折多在構成眶緣的骨縫（Moore）。", "examPoints": [], "pitfalls": "Hall 教材把 ectoconchion 寫成「額骨與顴骨的交會處、在內側面（on the medial aspect）」，和「平分線與外緣的交點」不是同一點，研究要寫明採用哪一版。平分線的高低會直接影響點位，先確認眶上、下緣再畫線。", "relatedMeasurements": ["Martin 51a 眶寬（d–ec）", "Martin 52 眶高", "眶指數（眶高×100÷眶寬；Yuan）"], "sources": ["https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v5（Skeleton·ID 手冊：雙側點）", "https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://docs.coracore.org/en/latest/forensics-anthro-guide/measurements/（CoRA：orbital breadth d–ec）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Anterior Aspect of Cranium、Walls of Cranial Cavity（Fig. 8.13）、Orbits（Fig. 8.44B）、Clinical Box: Fractures of Maxillae and Associated Bones（Fig. B8.1）、Clinical Box: Fractures of Orbit）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）"]}, "al": {"zh": "梨狀孔側點", "en": "alare", "abbr": "al", "bilateral": true, "region": "顏面・鼻", "bones": ["上頷骨"], "definition": "梨狀孔（鼻孔的骨性開口）邊緣最外側的點；左右 al 之間是鼻寬。", "howToFind": "正面放大梨狀孔，用垂直輔助線貼住左右最外側的骨緣，再用水平線確認兩點在同一橫切面，最後從側面確認（Skeleton·ID）。也可以用量測工具找 al–al 的最大值（Hall：卡尺量最寬處）。", "anatomy": "梨狀孔位在鼻骨下方，大部分由上頷骨圍成（Moore）。外鼻軟組織的鼻翼皮膚由眶下神經鼻支（V2）支配，和鼻背、鼻尖的 V1 不同（Moore）。", "clinical": "鼻寬與鼻高組成鼻指數（鼻寬×100÷鼻高；窄鼻 <48、中鼻 48–52.99、寬鼻 ≥53），是人類學描述鼻孔形態的指標（Yuan）。", "examPoints": [], "pitfalls": "骨性 alare 在梨狀孔骨緣上，不是軟組織的鼻翼；臉部照片的點名常借用顱骨點名，意思已經不同（Caple & Stephan 2016 摘要）。鼻區掃描品質差時可能無法定位（Skeleton·ID）。", "relatedMeasurements": ["Martin 54 鼻寬（al–al）", "鼻指數（鼻寬×100÷鼻高；Yuan）"], "sources": ["https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v5（Skeleton·ID 手冊：雙側點）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Anterior Aspect of Cranium、Vasculature and Innervation of Nose）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003：鼻指數）", "Caple J, Stephan CN. Int J Legal Med 2016;130:863–879（DOI 10.1007/s00414-015-1292-1；僅讀摘要，經 Europe PMC API）"]}, "id": {"zh": "下齒槽前點", "en": "infradentale", "abbr": "id", "bilateral": false, "region": "下頷", "bones": ["下頷骨"], "definition": "兩顆下中門齒之間齒槽中隔的頂端（前面的正中點）。", "howToFind": "正面放大下門齒區，找兩顆下中門齒之間的齒槽骨中隔，取它最上端的前面正中點；再轉側面確認點在骨上、不在牙上（Skeleton·ID）。", "anatomy": "下頷骨的齒槽部支持下頷牙（Moore）。左右下頷在正中以下頷聯合相接，出生後第 1 年開始癒合、第 2 年底前完成（Moore）。", "clinical": "拔牙後下頷齒槽部的骨會吸收，頦孔會逐漸靠近下頷體上緣（Moore），所以缺牙頭骨的 id 不可靠。", "examPoints": [], "pitfalls": "缺牙或齒槽吸收的頭骨不要標（Skeleton·ID）。教學模型的下頷常以彈簧連接，跨上下頷的量測受咬合位置影響（標註器提醒）。", "relatedMeasurements": ["頦高 id–gn（CoRA/DCP 2.0；未列 Martin 編號）"], "sources": ["https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Anterior Aspect of Cranium、Clinical Box: Resorption of Alveolar Bone（Fig. B8.3）、Clinical Box: Age Changes in Face）", "https://docs.coracore.org/en/latest/forensics-anthro-guide/measurements/（CoRA）"]}, "pg": {"zh": "頦前點", "en": "pogonion", "abbr": "pg", "bilateral": false, "region": "下頷", "bones": ["下頷骨"], "definition": "頦隆凸（mental protuberance）正中最向前突出的點。", "howToFind": "先擺正（FH），從側面找下巴輪廓最向前的點，再轉正面把點移到正中線上（Skeleton·ID）。頭一前傾或後仰，「最前點」就會上下滑動，所以一定要先擺正。", "anatomy": "頦隆凸是下頷聯合下方的三角形骨隆起，構成下巴的突出；下頷聯合是嬰兒左右下頷癒合的地方，出生後第 1 年開始癒合、第 2 年底前完成（Moore）。", "clinical": "頦隆凸（mental eminence）是頭骨性別目視判讀的五個特徵之一（Walker 2008）。", "examPoints": [], "pitfalls": "沒擺正就找最前點。教學模型的下頷常以彈簧連接，下頷位置會改變它和上頷、顱骨點的相對關係（標註器提醒）。", "relatedMeasurements": ["gnathion（取 pg 與 me 的中點時，依賴 pg 的位置）"], "sources": ["https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "https://nobellicense.nobelbiocare.com/Help/d3d046fb-52e8-4b33-9f51-d3fd98ca3ed4/2.0/EN/3D_cephalometric_hard_tissue_landmarks.htm（3D 頭影測量硬組織點定義）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Anterior Aspect of Cranium（Fig. 8.2A、B）、Clinical Box: Age Changes in Face）", "Walker PL. Am J Phys Anthropol 2008;136:39–50（DOI 10.1002/ajpa.20776；摘要經 Europe PMC API 讀取）"]}, "me": {"zh": "頦下點", "en": "menton", "abbr": "me", "bilateral": false, "region": "下頷", "bones": ["下頷骨"], "definition": "下頷聯合（頦部）正中最低的點。", "howToFind": "先擺正，在正面視角確認正中線，再沿正中線往下找下巴下緣的最低點（Skeleton·ID 用正面視角）。轉側面檢查點是否落在下頷聯合的下緣上。", "anatomy": "位在下頷聯合的正中下緣；頦隆凸就在下頷聯合下方（Moore）。", "clinical": "", "examPoints": [], "pitfalls": "下巴下緣常有凹裂，正中最低點不一定是下頷真正的最低處（Skeleton·ID）。沒擺正時最低點會偏；下頷以彈簧連接的模型要注意咬合位置（標註器提醒）。", "relatedMeasurements": ["gnathion（取 pg 與 me 的中點時，依賴 me 的位置）"], "sources": ["https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "https://nobellicense.nobelbiocare.com/Help/d3d046fb-52e8-4b33-9f51-d3fd98ca3ed4/2.0/EN/3D_cephalometric_hard_tissue_landmarks.htm（3D 頭影測量硬組織點定義）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Anterior Aspect of Cranium（Fig. 8.2A、B））"]}, "gn": {"zh": "頦頂點", "en": "gnathion", "abbr": "gn", "bilateral": false, "region": "下頷", "bones": ["下頷骨"], "definition": "頦部正中、pogonion 與 menton 之間的中點（Skeleton·ID 手冊版，標註器採用）；另有教材定義為下頷體下緣頦部的正中點。", "howToFind": "先標好 pg 與 me，再在兩點之間的正中輪廓上取中點（Skeleton·ID：先定 pg、me 當參考）。如果研究採用 Hall 的定義，則改取頦部下頷體下緣的正中點，並在紀錄中寫明。", "anatomy": "位在頦隆凸前下方的輪廓上；頦隆凸是下頷聯合下方的三角形隆起（Moore）。", "clinical": "", "examPoints": [], "pitfalls": "至少三種定義：pg–me 中點（Skeleton·ID；標註器定義註明引 Caple & Stephan）、頦部下頷體下緣的正中點（Hall）、下頷緣最前且最低的正中點（Yuan）。研究要寫明採哪一版。Hall 量全面高（n–gn）時要讓牙齒咬合；下頷以彈簧連接的模型尤其要注意（標註器提醒）。", "relatedMeasurements": ["Martin 47 全面高（n–gn，編號未查證）", "頦高 id–gn（CoRA/DCP 2.0；未列 Martin 編號）"], "sources": ["https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://docs.coracore.org/en/latest/forensics-anthro-guide/measurements/（CoRA）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Anterior Aspect of Cranium（Fig. 8.2A、B））"]}, "go": {"zh": "下頷角點", "en": "gonion", "abbr": "go", "bilateral": true, "region": "下頷", "bones": ["下頷骨"], "definition": "下頷角圓弧上，平分「下頷枝後緣切線」與「下頷體下緣切線」夾角的點。", "howToFind": "側面看下頷，沿下頷枝後緣與下頷體下緣各畫一條切線，兩線夾角的角平分線和下頷角圓弧的交點就是 go。角不明顯時，取下頷枝與下頷體轉折處曲度最大的點（Skeleton·ID）。", "anatomy": "下頷骨分水平的下頷體與垂直的下頷枝，兩者轉角就是下頷角（Moore）。咬肌由顴弓止於下頜角／下頜支，內翼肌止於下頜角內側（Moore）。腮腺的尖端在下頷角後方（Moore）。", "clinical": "下頷角皮膚由耳大神經（C2–C3，頸叢）支配而非三叉神經，所以三叉神經全損時這裡仍有感覺（Moore）。下頷角骨折多為斜行，可能經過第三大臼齒的齒槽（Moore）。約 20% 的人顏面神經下頷緣支走在下頷角下方（Moore）。", "examPoints": [], "pitfalls": "下頷角圓鈍時切線不好畫，要記錄取點方式；左右都要標。教學模型的下頷以彈簧連接，張口程度會改變 go 和顱骨點的關係（標註器提醒）。", "relatedMeasurements": ["Martin 66 下頷角寬（go–go）"], "sources": ["https://nobellicense.nobelbiocare.com/Help/d3d046fb-52e8-4b33-9f51-d3fd98ca3ed4/2.0/EN/3D_cephalometric_hard_tissue_landmarks.htm（3D 頭影測量硬組織點定義）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v5（Skeleton·ID 手冊：雙側點）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Anterior Aspect of Cranium（Fig. 8.2B、C）、Clinical Box: Fractures of Mandible（Fig. B8.2）、Nerves of Face and Scalp: Facial Nerve、Clinical Box: Lesions of Trigeminal Nerve、The Bottom Line: Face and Scalp、Parotid Gland、Infratemporal Fossa、Table 8.11；Ch.9；Nerves of Lateral Cervical Region）"]}, "pt": {"zh": "翼點", "en": "pterion", "abbr": "pt", "bilateral": true, "region": "側面", "bones": ["額骨", "頂骨", "顳骨鱗部", "蝶骨大翼"], "definition": "顳窩前部，額骨、頂骨、顳骨鱗部與蝶骨大翼四骨交會處，通常呈 H 形骨縫。", "howToFind": "側面看顳窩前部，約在顴弓中點上方 3–4 cm；體表定位是顴弓上方兩指寬、顴骨額突後方一拇指寬（Moore）。模型尺寸還沒校正時公分數不能直接用，改用顴弓、顴骨額突當參考，開著貼圖找四塊骨頭交會的縫。", "anatomy": "翼點的骨頭薄，內面有中腦膜動脈額（前）支走在顱骨側壁內面的溝裡（Moore）。中腦膜動脈是上頷動脈的分支，經棘孔入顱，在蝶骨大翼上分前後支，額支往上到翼點再轉向頭頂（Moore）。嬰兒期這裡是前外側囟（蝶囟），在嬰兒期閉合（Moore）。", "clinical": "側頭部重擊（例如拳擊）可使翼點薄骨骨折，撕裂跨過翼點的中腦膜動脈或靜脈額支，形成硬腦膜外血腫壓迫大腦皮質，未治療可在數小時內致死（Moore）；典型病程有清醒期（lucid interval）（Moore）。", "examPoints": [], "pitfalls": "骨縫型態有變異：通常是 H 形，較少數是額骨直接接顳骨，有時四骨交於一點（Moore）。H 形時取哪一點各研究做法不一（未驗證），要自訂規則並寫明。", "relatedMeasurements": [], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Table 8.1、Fig. 8.4A、Lateral Aspect of Cranium、Dura Mater: Vasculature of Dura Mater（Fig. 8.28D）、Clinical Box: Development of Cranium（Fig. B8.6B）、Clinical Box: Fracture of Pterion（Fig. B8.17）、Clinical Box: Head Injuries and Intracranial Hemorrhage（Fig. B8.20））"]}, "ast": {"zh": "星點", "en": "asterion", "abbr": "ast", "bilateral": true, "region": "側面", "bones": ["頂骨", "枕骨", "顳骨（乳突部）"], "definition": "頂乳突縫、枕乳突縫與人字縫三縫交會處，也就是頂骨、枕骨、顳骨的交界點。", "howToFind": "從後外側（枕面加側面）看乳突的後上方，沿人字縫往外下走，找它和頂乳突縫、枕乳突縫會合的點（Skeleton·ID）。有縫間骨或骨縫不清時，把人字縫延長，取各交點之間的中間位置（Skeleton·ID）。", "anatomy": "三條縫交會、形如星芒（Moore）。嬰兒期這裡是後外側囟（乳突囟），在嬰兒期閉合（Moore）。縫間骨常出現在乳突附近（Moore）。", "clinical": "傳統上被當作顱底手術鑽孔（keyhole）的體表標記，但骨縫常不易辨認，直接在星點鑽孔可能傷到靜脈竇（Li 2020）；有作者認為它較適合用來估計橫竇外側的位置，而不是當鑽孔點（Jurgaitis 2024 轉述 Hall 等人）。", "examPoints": [], "pitfalls": "縫間骨多時容易點錯；三條縫任一條不清楚，點就會偏（Li 2020 也指出星點常難辨認）。左右都要標。", "relatedMeasurements": [], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Table 8.1、Occipital Aspect of Cranium（Fig. 8.4B、C）、Clinical Box: Development of Cranium（Fig. B8.6B））", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v5（Skeleton·ID 手冊：雙側點）", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7099776/（Li 2020 BMC Neurol：mastoid notch 與橫竇–乙狀竇交界）", "https://pmc.ncbi.nlm.nih.gov/articles/PMC11135237/（Jurgaitis 2024 Cureus：橫竇–乙狀竇交界的體表標記）"]}, "i": {"zh": "枕外隆凸點", "en": "inion", "abbr": "i", "bilateral": false, "region": "枕部", "bones": ["枕骨"], "definition": "枕外隆凸（external occipital protuberance）最突出的點（Moore）；Skeleton·ID 手冊則定在左右上項線頂端之間、隆凸的基部。", "howToFind": "從側面找枕部正中最向後突的枕外隆凸，再轉後面確認在正中線上；上項線從它向兩側延伸（Moore）。依採用的定義取隆凸尖端（Moore）或基部（Skeleton·ID），同一研究要一致。", "anatomy": "枕外隆凸在正中線通常容易摸到，但有時（尤其女性）不明顯（Moore）。上項線是頸部的上界；枕外嵴從隆凸往下延伸到枕骨大孔；項韌帶附著在枕外隆凸與枕骨大孔後緣（Moore）。隆凸下方深處可摸到 C2 棘突（Moore）。", "clinical": "上項線與枕外隆凸不能準確定位橫竇（Jurgaitis 2024）。項區（nuchal area）是頭骨性別目視判讀的五個特徵之一（Walker 2008）。", "examPoints": [], "pitfalls": "尖端 vs 基部兩種定義（Moore vs Skeleton·ID）。不要和 op 混用：op 的定義要避開枕外隆凸（Hall、Yuan）。隆凸不明顯時不要硬點。", "relatedMeasurements": ["Martin 1 最大顱長（g–op；op 不取在枕外隆凸上）"], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.2；Surface Anatomy of Cervical and Thoracic Vertebrae、Accessory Ligaments of Intervertebral Joints；Ch.8；Table 8.1、Occipital Aspect of Cranium（Fig. 8.7A））", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：正中點）", "https://med.libretexts.org/Learning_Objects/Laboratories/Introduction_to_Human_Osteology_(Hall_et_al.)/02:_Crania/2.04:_Landmarks_and_Measurements_of_the_Skull（Hall et al.）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003）", "https://pmc.ncbi.nlm.nih.gov/articles/PMC11135237/（Jurgaitis 2024 Cureus）", "Walker PL. Am J Phys Anthropol 2008;136:39–50（DOI 10.1002/ajpa.20776；摘要經 Europe PMC API 讀取）"]}, "sof": {"zh": "眶上孔", "en": "supraorbital foramen", "abbr": "sof", "aliases": ["supraorbital foramen", "supra-orbital foramen", "supraorbital notch", "supra-orbital notch", "supraorbital notch/foramen", "foramen supraorbitale", "incisura supraorbitalis", "眶上孔", "眶上切跡", "眶上切迹"], "bilateral": true, "region": "顏面・眼眶", "bones": ["額骨"], "definition": "額骨眶上緣（額骨鱗部與眶部交界的稜）上，讓眶上神經與眶上動、靜脈由眼眶出到前額的開口；有的人是完整的孔（眶上孔），有的人只是緣上的缺口（眶上切跡）（Moore）。", "howToFind": "正面看，先認出眶上緣和它上方的眉弓（Moore），沿眶上緣由內往外，約在內 1/3 與外 2/3 交界處找（NYSORA）：切跡型是緣上的缺口，孔型是完整小孔，泰國頭骨量到眶上切跡／孔平均位在眶上緣上方約 3 mm，所以也要看緣的稍上方（Apinhasmit 2006）。它內側可能還有較小的滑車上切跡或孔，不要標錯（Radiopaedia）。左右位置用比例核對：它大約在鼻正中線與額骨顳線的中點（實物分別約 25 mm 與 27 mm；Apinhasmit 2006），離正中線的距離和同側頦孔差不多、眶下孔則略偏外（Chung 1995）。臨床口訣「病人平視時在瞳孔正上方」（MSD）在頭骨上沒有瞳孔可對，改用上述比例；模型約為實物 6 倍且未校正，毫米數只看相對大小。", "anatomy": "眶上神經屬 V1（眼神經）：額神經在眶頂約中段分成較大的眶上神經和較小的滑車上神經，眶上神經沿眶頂往前、經眶上切跡或孔出眶，再上行到前額（Moore）。它分布到額竇黏膜、上眼瞼中段的皮膚與結膜，以及前外側前額與頭皮，往後可到頭頂（兩耳連線）（Moore）。伴行的眶上動脈是眼動脈的終支、屬內頸動脈系統，供應前額與前頭皮直到頭頂；眶上靜脈有一支穿過切跡與眼上靜脈相通（Moore）。", "clinical": "眶上（眼神經）阻斷：在眶上緣摸到切跡處注射，可麻醉同側前額、前頭皮，有時含上眼瞼，適用於前頭皮、前額、眉毛或上眼瞼的撕裂傷與手術；併發症有血腫、神經炎與誤打入血管（MSD），也可能傷到眼球（NYSORA）。眶上神經的出口位置在眶上內視鏡手術、前額與顏面美容整形及顎顏面手術中都很重要，術中要辨認並保護（Kabakcı 2025）。", "examPoints": [], "pitfalls": "切跡或孔因人群而異：韓國頭骨切跡 69.9%、孔 28.9%（Chung 1995），另一篇屍體與頭骨研究則孔與切跡約各半（Kabakcı 2025）；建議切跡型把點放在缺口最深處、孔型放在開口中心（此為標點慣例建議，需與網站其他點一致）。Moore 圖 8.3 說眶上切跡、眶下孔、頦孔大致在同一垂直線，但韓國頭骨三孔同在一矢狀面只有 38.1%、眶下孔 63.6% 偏外（Chung 1995），67 具屍體的研究也量到眶下孔明顯較外（離中線 25.3／29.6／25.6 mm；Hester 2021），所以「三孔一直線」只能當粗略原則（未驗證）。眶上孔（額骨、眶緣表面）不要和眶上裂（蝶骨大、小翼之間，位在眶尖）搞混（Moore），眶上區也可能另有額孔或額切跡（Kabakcı 2025）。左右兩側量測值相近（Kabakcı 2025），一側看不清時可對照對側；照片貼圖的陰影可能像孔，標點前要轉動視角確認幾何上真的有缺口或開口。", "relatedMeasurements": [], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Fig. 8.3 圖說：三孔大致在一垂直線；Anterior Aspect of Cranium 段落：眶上緣、眶上孔（切跡）、眉弓；Table 8.4 眶上神經起源、走向與分布；Nerves of Face and Scalp／Ophthalmic Nerve 段落：額神經在眶頂中段分叉；Table 8.5 眶上動脈；Superficial Arteries of Face 段落：眶上動脈供應前頭皮到頭頂；Table 8.6 眶上靜脈經切跡通眼上靜脈；Middle Cranial Fossa 段落：眶上裂位於蝶骨大、小翼之間；The Bottom Line: Orbits, Eyeball, and Accessory Visual Structures：眶上裂位於眶尖；Paranasal Sinuses／Frontal Sinuses 段落：額竇由眶上神經支配）", "https://radiopaedia.org/articles/supraorbital-foramen（Radiopaedia：Supraorbital foramen；位於眶上緣、滑車上孔外側、眉弓下方）", "https://nysora.com/regional-anesthesia/techniques/head-and-neck-blocks/nerve-blocks-face/（NYSORA：Nerve Blocks of the Face；距中線約 2 cm、內 1/3 與外 2/3 交界、併發症）", "https://www.msdmanuals.com/professional/injuries-poisoning/how-to-do-anesthesia-procedures/how-to-do-an-ophthalmic-nerve-block（MSD Manual 專業版：How To Do an Ophthalmic Nerve Block，2024-10 更新）", "Chung MS 等. Acta Anat (Basel) 1995;154:162-166（124 個韓國頭骨；PMID 8722516；摘要經 Europe PMC API 讀取）https://pubmed.ncbi.nlm.nih.gov/8722516/", "Apinhasmit W 等. J Med Assoc Thai 2006;89:675-682（106 個泰國成人頭骨；PMID 16756055；摘要經 Europe PMC API 讀取）https://pubmed.ncbi.nlm.nih.gov/16756055/", "Kabakcı AG, Bozkır MG. Aesthetic Plast Surg 2025;49:322-333（28 具屍體＋38 個頭骨；PMID 38951229；摘要經 Europe PMC API 讀取）https://pubmed.ncbi.nlm.nih.gov/38951229/", "Hester KM 等. J Anat 2021;239:782-787（67 具屍體；PMID 34120334；摘要經 Europe PMC API 讀取）https://doi.org/10.1111/joa.13482"]}, "iof": {"zh": "眶下孔", "en": "infraorbital foramen", "abbr": "iof", "aliases": ["infraorbital foramen", "infra-orbital foramen", "foramen infraorbitale", "眶下孔"], "bilateral": true, "region": "顏面・上頷", "bones": ["上頷骨"], "definition": "上頷骨前面、眶下緣下方的孔，是眶下管的前端出口，眶下神經（V2 的延續）與眶下動、靜脈由此到臉部（Moore；Radiopaedia）。", "howToFind": "從眶下緣中段往下，在上頷骨前面找：孔在眶下緣下方、犬齒窩上方（Radiopaedia），貼在顴上頷縫的內側（實物平均約 2 mm；Apinhasmit 2006）。用比例核對：孔到眶下緣的距離約為眶上孔到眶下孔連線長度的 1/5（實物約 8.6–9.2 mm 對 45 mm；Chung 1995、Apinhasmit 2006），高度大約在眶上孔與上排牙齒咬合面的中點，且常與上排第二小臼齒在同一垂直線上（Apinhasmit 2006）。從眶上孔往下看，眶下孔多半略偏外（韓國頭骨 63.6%，兩孔連線與矢狀面平均夾 5.8°；Chung 1995）。開口通常朝下內方（Apinhasmit 2006），建議把模型轉到稍由下內方往上看的角度確認開口，點放在外口中心；模型未校正，毫米數只看比例。", "anatomy": "上頷神經（V2）經眶下裂進入眼眶後改稱眶下神經，走在眶底的眶下溝與眶下管內（眶底也是上頷竇的頂），沿途分出上頷竇黏膜支與前、中上齒槽支，出眶下孔後立刻分成下眼瞼支、內外鼻支與上唇支（Moore）。分布：上頷竇黏膜、同側上排門齒到小臼齒、下眼瞼皮膚與結膜，以及臉頰、鼻側（含鼻翼）與上唇的皮膚和黏膜（Moore）。伴行的眶下動脈來自上頷動脈第三段（外頸動脈系統），同樣經眶下溝、管、孔到臉，沿途供應下直肌、下斜肌、淚囊、上頷竇黏膜與上排犬齒、門齒（Moore）。", "clinical": "眶下神經阻斷用於上唇、臉頰傷口或上頷門齒的處置：常經口內掀起上唇，由口腔黏膜與牙齦交界的前庭溝進針朝向眶下孔（Moore），MSD 的做法是貼著上排第二小臼齒、沿牙長軸進針約 2.5 cm，注射前都要回抽，避免打進伴行的眶下血管（Moore；MSD）。孔的正上方就是眼眶，進針角度太平會插太深而進入眼眶，可能造成暫時性眼外肌麻痺或刺到眼球（Moore；MSD）。眶底骨折可能波及眶下孔，造成眶下神經分布區感覺異常（Radiopaedia）；Le Fort II 型骨折線可經過眶下孔（Moore），Le Fort 截骨術後的眶下神經感覺障礙也可能和副眶下孔有關（Iwanaga 2020）。V2 是三叉神經痛最常侵犯的分支，曾以酒精在眶下孔阻斷，或在此處切斷神經分支來緩解（Moore）。", "examPoints": [], "pitfalls": "眶下孔（上頷骨前面的出口）不是眶下裂（V2 由翼腭窩進入眼眶的裂隙）（Moore）；孔中心在眶下緣下方平均不到 1 cm（Chung 1995 為 8.6 mm、Apinhasmit 2006 為 9.2 mm），不要把點標在眶緣上。副眶下孔不少見：文獻回顧整體約 16.9%（各研究 0.8–27.3%），92.2% 位在主孔上內側（Hwang 2015），另一屍體研究為 18.2%、平均在主孔上內側 7.2 mm（Shin 2020）；副孔平均約 1.6–1.8 mm（Iwanaga 2020），比主孔（寬約 3.4–4.8 mm；Apinhasmit 2006、Chung 1995）小，標點要選主孔。後上齒槽神經從哪裡分出，來源說法不一：Moore 的 CN V2 分支表把它列為 V2 在眶下神經之外直接分出的分支，Radiopaedia 則寫成三條上齒槽神經都在眶下溝內由眶下神經分出（未驗證）。", "relatedMeasurements": [], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8、Ch.10；Fig. 8.3 圖說；Anterior Aspect of Cranium 段落：上頷骨眶下孔；Clinical Box「Fractures of Maxillae and Associated Bones」與 Fig. B8.1：Le Fort II 骨折線；Table 8.4 眶下神經走向、分支與分布；Nerves of Face and Scalp／Maxillary Nerve 段落：V2 經眶下裂→眶下溝與孔、沿途分支；Clinical Box「Infra-Orbital Nerve Block」：眶下神經阻斷；Clinical Box「Trigeminal Neuralgia」：三叉神經痛；Orbits 段落（眶壁）：眶底與上頷竇共用；Table 8.9 與 Table 8.12 眶下動脈；Lips and Cheeks 段落：上唇感覺；Pterygopalatine Fossa／Maxillary Nerve 段落：V2 出眶下裂後稱眶下神經；Vasculature and Innervation of Nose 段落：鼻翼由眶下神經鼻支支配；Table 10.4 的 CN V2 分支）", "https://radiopaedia.org/articles/infraorbital-foramen（Radiopaedia：Infraorbital foramen；犬齒窩上方、眶底骨折致感覺異常、上齒槽神經寫法）", "https://www.msdmanuals.com/professional/dental-disorders/how-to-do-dental-procedures/how-to-do-an-infraorbital-nerve-block-intraoral（MSD Manual 專業版：How To Do an Infraorbital Nerve Block, Intraoral，2025-05 更新）", "Chung MS 等. Acta Anat (Basel) 1995;154:162-166（PMID 8722516；摘要經 Europe PMC API 讀取）https://pubmed.ncbi.nlm.nih.gov/8722516/", "Apinhasmit W 等. J Med Assoc Thai 2006;89:675-682（PMID 16756055；摘要經 Europe PMC API 讀取）https://pubmed.ncbi.nlm.nih.gov/16756055/", "Hwang K 等. J Craniofac Surg 2015;26:274-276（副眶下孔文獻回顧 13 篇；PMID 25490578；摘要經 Europe PMC API 讀取）https://pubmed.ncbi.nlm.nih.gov/25490578/", "Shin KJ 等. Sci Rep 2020;10:8566（25 具屍體 44 側；PMID 32444685；摘要經 Europe PMC API 讀取）https://doi.org/10.1038/s41598-020-65330-4", "Iwanaga J 等. J Oral Maxillofac Surg 2020;78:717-723（30 個新鮮冷凍頭顱；PMID 32035836；摘要經 Europe PMC API 讀取）https://pubmed.ncbi.nlm.nih.gov/32035836/"]}, "mf": {"zh": "頦孔", "en": "mental foramen", "abbr": "mf", "aliases": ["mental foramen", "foramen mentale", "頦孔", "颏孔"], "bilateral": true, "region": "下頷", "bones": ["下頷骨"], "definition": "下頷體前外側面的孔，成人約在第二小臼齒下方，是下頷管的前端出口，頦神經（V3 下齒槽神經的終支）與頦動、靜脈由此穿出（Moore）。", "howToFind": "在下頷體前外側面、第二小臼齒下方找（Moore）：韓國有牙屍體 75% 在第二小臼齒正下方、15.6% 在第二小臼齒與第一大臼齒之間（Kim 2025），正常變異可落在犬齒到第一大臼齒之間（Radiopaedia）。有牙的成人，孔中心大約在牙齦緣與下頷骨下緣的中間高度（實物 16.6 mm 對 15.5 mm；Kim 2025）。左右位置可對照同側眶上切跡或孔：韓國頭骨 69.3% 的頦孔與它在同一矢狀面（Chung 1995）。開口方向研究間描述不同（泰國頭骨多朝後上方，Apinhasmit 2006；韓國 CBCT 後外側與正外側各半，Kim 2025），建議從前外側稍偏後方轉著看確認開口，點放在外口中心；模型未校正，毫米數只看比例。", "anatomy": "下齒槽神經（V3）由下頷枝內側的下頷孔進入下頷管，形成下齒叢供應同側全部下排牙齒，頦神經則經頦孔穿出（Moore）。頦神經分布到同側下唇的皮膚與黏膜、下巴皮膚，以及下排門齒的唇側牙齦（Moore）。伴行的頦動脈是下齒槽動脈的終支、來自上頷動脈，出頦孔後到下巴，是上頷動脈唯一的淺層分支（Moore）。", "clinical": "頦神經阻斷：縫合下唇或下巴撕裂傷時，在頦孔處注射可麻醉同側下唇皮膚黏膜與下巴皮膚到中線（Moore）；MSD 建議經口內從下排第一、二小臼齒間的前庭溝進針，回抽後把藥打在孔旁、不要打進孔內（MSD），NYSORA 也要求進針避免穿入孔內，這和 Moore 寫的「注入頦孔」不同（未驗證）。下齒槽神經阻斷是在下頷枝內側的下頷孔附近注射，麻醉範圍也涵蓋頦神經區（Moore）。拔牙後齒槽骨吸收，頦孔會逐漸靠近下頷體上緣甚至消失，使頦神經外露，假牙壓迫會在進食時疼痛（Moore）；植牙、截骨與根尖手術都要先定位頦孔以免傷到頦神經（Kim 2025）。", "examPoints": [], "pitfalls": "頦孔是出口、下頷孔是入口：下齒槽神經從下頷枝內側的下頷孔進入下頷管，頦神經再由頦孔出來（Moore）。中文是「頦」（下巴）不是「頰」（臉頰）（樂詞網）；下頷角的皮膚歸耳大神經（C2–C3）而不是頦神經（Moore）。副頦孔合併盛行率約 6.1%（27 篇統合分析），多半很小（直徑約 1 mm）、距主孔約 3.6–4.1 mm 且多在後方（Thomaidi 2025），標點要選主孔。無牙後齒槽骨吸收，頦孔會上移到接近上緣甚至消失（Moore），所以「牙齦緣與下緣中間高度」「第二小臼齒下方」只適用有牙成人；若模型牙齒缺失或排列不像真牙，改以下頷骨下緣與正中線的相對位置判斷。", "relatedMeasurements": [], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Fig. 8.3 圖說；Anterior Aspect of Cranium 段落：頦孔在第二小臼齒下方；Clinical Box「Resorption of Alveolar Bone」與 Fig. B8.3：無牙後頦孔移向上緣或消失；Table 8.4 頦神經、耳大神經管下頷角皮膚；Table 8.5 頦動脈；Superficial Arteries of Face 段落：頦動脈為上頷動脈唯一淺層分支；Clinical Box「Mental Nerve Blocks」：頦神經阻斷；Neurovasculature of Infratemporal Fossa 段落：下齒槽神經、下齒叢與頦神經分布；Clinical Box「Inferior Alveolar Nerve Block」：下齒槽神經阻斷在下頷枝內側下頷孔、也麻頦神經區；Lips and Cheeks 段落：下唇感覺）", "https://radiopaedia.org/articles/mental-foramen-1（Radiopaedia：Mental foramen；第二小臼齒牙根旁、變異在犬齒到第一大臼齒間）", "https://www.msdmanuals.com/professional/dental-disorders/how-to-do-dental-procedures/how-to-do-a-mental-nerve-block（MSD Manual 專業版：How To Do a Mental Nerve Block，2026-07 更新）", "https://nysora.com/regional-anesthesia/techniques/head-and-neck-blocks/nerve-blocks-face/（NYSORA：Nerve Blocks of the Face；頦神經阻斷進針避免穿入孔內）", "Kim YH, Hur MS. Diagnostics (Basel) 2025;15:3109（16 具韓國有牙屍體 32 側＋CBCT；PMID 41464109；摘要經 Europe PMC API 讀取）https://doi.org/10.3390/diagnostics15243109", "Thomaidi ZM 等. Dent J (Basel) 2025;13:94（114 個乾下頷骨＋27 篇統合分析；PMID 40136722；摘要經 Europe PMC API 讀取）https://doi.org/10.3390/dj13030094", "Chung MS 等. Acta Anat (Basel) 1995;154:162-166（PMID 8722516；摘要經 Europe PMC API 讀取）https://pubmed.ncbi.nlm.nih.gov/8722516/", "Apinhasmit W 等. J Med Assoc Thai 2006;89:675-682（PMID 16756055；摘要經 Europe PMC API 讀取）https://pubmed.ncbi.nlm.nih.gov/16756055/", "https://terms.naer.edu.tw/（樂詞網，2026-09-25 查詢：mental foramen→頦孔、chin→頦；下巴、cheek→頰（醫學名詞））"]}, "pf": {"zh": "頂孔", "en": "parietal foramen", "abbr": "pf", "aliases": ["parietal foramen", "parietal foramina", "頂孔"], "bilateral": true, "region": "顱頂", "bones": ["頂骨"], "definition": "頂骨後部、緊靠矢狀縫的小孔，是頂導靜脈穿過顱頂的導孔（emissary foramen）；它不恆定，可能單側、雙側或完全沒有（Moore）。", "howToFind": "從正上方或後上方看顱頂，先找 lambda（矢狀縫與人字縫交點），沿矢狀縫往 bregma 走約 1/3，在縫的左右兩旁找小圓孔：實物研究中 bregma–lambda 長與「孔到 lambda」的距離約 3:1，孔落在頂骨中 1/3 與後 1/3 交界（Sağlam 2025）。孔很貼縫：實物平均離縫約 7 mm、在 lambda 前方約 34 mm，約 1:5（Sağlam 2025；Kilic Safak 2025 量到離縫 7.4 mm）；模型尺寸沒校正，只用這種比例，不要直接量公分。實物孔徑平均約 1.7 mm（Sağlam 2025），網格上可能只剩淺凹或貼圖上的小黑點：開著貼圖找到後，關掉貼圖確認網格上真的有凹孔、不是污漬，建議標在孔外口中心。", "anatomy": "頂導靜脈（parietal emissary vein）穿過頂孔，連接上矢狀竇與顱外、尤其頭皮的靜脈，可能左右成對（Moore；TeachMeAnatomy），也和板障靜脈相通（Sağlam 2025）。導靜脈沒有瓣膜，血流通常離腦，但兩個方向都能流（Moore）。顱蓋內面矢狀縫兩旁還有多個小導孔，讓上矢狀竇與板障、頭皮靜脈相通（Moore）。偶有枕動脈小分支一起通過（Wikipedia；Moore 未提，未驗證）。", "clinical": "頭皮第 4 層疏鬆結締組織是「危險區」，這層的感染可沿穿過頂孔的小導靜脈進入顱腔、波及腦膜（Moore）；在矢狀縫附近開刀時也要知道頂孔位置，以免傷到導靜脈（Sağlam 2025）。增大頂孔（enlarged parietal foramina, EPF）是頂骨骨化不全留下的對稱圓洞，從數 mm 到數 cm，位在矢狀縫與人字縫交會附近，一般認為和常見、通導靜脈的小頂孔在病理上不同（MedlinePlus；Radiopaedia）；孔徑 >5 mm 就算增大（Sağlam 2025），有作者建議此時做影像檢查找皮質與靜脈異常（Radiopaedia）。EPF 為體染色體顯性遺傳（ALX4 約 60%、MSX2 約 40%），盛行率約 1/15,000–1/50,000；多數沒有症狀，但洞口受撞擊時腦傷與顱骨骨折風險增加、按壓可引起劇烈頭痛，少數合併頭皮缺損、癲癇或腦結構異常（MedlinePlus）。", "examPoints": [], "pitfalls": "頂孔常單側或缺如：40 個頭骨中 47.5% 兩側都沒有、25% 單側、27.5% 雙側（Kilic Safak 2025），Moore 圖 8.8C 就是單側例；沒有的一側不標，少數孔直接開在矢狀縫上（Sağlam 2025：118 個中 8 個），這種建議另外註記。不要和 obelion 混：obelion 是兩側頂孔連線與矢狀縫的交點，屬正中點（Radiopaedia），頂孔本身在縫旁。lambda 附近常有縫間骨（Moore），骨縫交錯處的凹點不是頂孔；乳突孔（通乳突導靜脈；Moore Table 8.2）在顳骨乳突部，離矢狀縫很遠。頂孔在顱蓋上，顱蓋鋸開過時，它和顱底點的距離會吃進顱蓋裝回的誤差（見網站標註頁 b、l 點的顱蓋注意事項）。", "relatedMeasurements": [], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Occipital Aspect of Cranium 段落（縫間骨）、Fig. 8.8 與 Superior Aspect of Cranium 段落（頂孔）、Table 8.2（乳突孔）、Clinical Box「Scalp Infections」（頭皮感染）、Fig. 8.28E 圖說（顱蓋內面導孔）、Dural Venous Sinuses 段落（導靜脈））", "https://pmc.ncbi.nlm.nih.gov/articles/PMC12478824/（Sağlam 2025 J Clin Pract Res 47(1)：174 塊成人頂骨）", "https://pmc.ncbi.nlm.nih.gov/articles/PMC11977741/（Kilic Safak 2025 Medicine 104(14)：40 個頭骨）", "https://medlineplus.gov/genetics/condition/enlarged-parietal-foramina（MedlinePlus Genetics：EPF）", "https://radiopaedia.org/articles/enlarged-parietal-foramina（Radiopaedia：Giant parietal foramina）", "https://radiopaedia.org/articles/obelion（Radiopaedia：obelion）", "https://teachmeanatomy.info/head/osteology/parietal/（TeachMeAnatomy：頂骨）", "https://en.wikipedia.org/wiki/Parietal_foramina（輔助，只用於枕動脈分支一句）"]}, "ans": {"zh": "前鼻棘", "en": "anterior nasal spine", "abbr": "ans", "aliases": ["anterior nasal spine", "前鼻棘", "前鼻嵴", "ans"], "bilateral": false, "region": "顏面・鼻", "bones": ["上頷骨"], "definition": "左右上頷骨在正中線（上頷間縫）癒合、從梨狀孔下緣正中往前突出的小骨棘（Park 2023；Radiopaedia；Wikipedia）；頭影測量的 ANS 點取它的前端尖點（Radiopaedia）。", "howToFind": "正面看梨狀孔（上頷骨圍成的梨形前鼻孔；Moore），在下緣正中找一根朝你突出的小骨棘；從孔內可看到正中的骨性鼻中隔（Moore），前鼻棘就在這片隔板的前下端（Radiopaedia）。轉到側面最好認：它是梨狀孔與上門齒齒槽之間骨輪廓最往前凸的尖點，尖點下方有一個凹（A 點／subspinale；Radiopaedia、Skeleton·ID），再往下才是 prosthion（pr）。標點取棘的最前端（頭影測量 ANS 的定義；Radiopaedia）；模型尺寸沒校正，只靠這些相對位置找，不要量公分。", "anatomy": "前鼻棘屬上頷骨，在活人約位於鼻孔高度、人中最上端（Radiopaedia；Wikipedia），支撐鼻中隔前下部；後方對應的是顎骨形成、從硬顎後緣正中往後突的後鼻棘（Radiopaedia；Moore）。骨性鼻中隔由篩骨垂直板、犁骨，加上上頷骨與顎骨的鼻嵴組成，隔軟骨以榫槽（tongue-and-groove）方式嵌在骨性鼻中隔邊緣（Moore）。Moore 用一條約通過前鼻棘與蝶篩隱窩的斜線劃分鼻黏膜神經：後下部主要是 V2，前上部是 V1（Moore）。", "clinical": "頭影測量把 ANS（鼻棘前端）與 PNS（硬顎後端）連成顎平面（palatal plane），JNMA 2019 即用它評估上下顎前後關係（Radiopaedia；JNMA 2019）。前鼻棘歪斜與鼻孔不對稱、鼻小柱歪斜、鼻尖不對稱變鈍及鼻塞有關（Park 2023）；鼻中隔手術時可繞前鼻棘縫一針，把鼻中隔固定在正中（Otten & Fagan）。單獨的前鼻棘骨折被描述為少見、常被忽略（Radiopaedia）；但 Park 2023 轉引 You 等：200 例顏面外傷 CT 中 ANS 骨折率 22%、95% 漏診，兩者說法有落差，「少見」可能部分是漏診造成的低估（未驗證）。", "examPoints": [], "pitfalls": "前鼻棘不是鼻棘點 ns：ns 是左右梨狀孔下緣最低點的切線與正中面的交點，用來量鼻高（網站 ns 教材；IITG），前鼻棘則標棘的最前端；兩者都在梨狀孔下緣正中附近，正面看容易重疊，要轉側面分開（ns 教材也提醒別點到前鼻棘尖端）。名稱相近別混：額骨也有鼻棘，屬鼻腔頂的前段（Moore），後鼻棘 PNS 在硬顎後端（Moore），前鼻棘下方最深的凹是 A 點／subspinale（Radiopaedia）。傳統顱骨測量把 acanthion、ANS、nasospinale 列為三個不同的正中點（Yuan），但字典對 acanthion 有「棘基部」與「棘尖端」兩種定義（Wiktionary），讀文獻要看作者用哪一種（未驗證）。棘很細，塑膠翻模或手機掃描可能把尖端做鈍或做缺：標點前關掉貼圖看網格形狀，尖端不完整就註明或不標（Skeleton·ID 也提醒鼻棘小或磨損時附近點位難定）。", "relatedMeasurements": [], "sources": ["Dalley AF II, Agur AMR. Moore's Clinically Oriented Anatomy, 9th ed. Wolters Kluwer; 2023.（Ch.8；Anterior Aspect of Cranium 段落（梨狀孔、上頷間縫）、External Surface of Cranial Base 段落（後鼻棘）、Skeleton of External Nose 段落（額骨鼻棘）、Nasal Septum 段落（鼻中隔組成）、Boundaries of Nasal Cavities 段落（鼻腔頂三段）、Vasculature and Innervation of Nose 段落（V1/V2 分界線））", "https://radiopaedia.org/articles/lateral-cephalogram（Radiopaedia：ANS、PNS、A 點定義）", "https://radiopaedia.org/cases/anterior-nasal-spine-fracture-1（Radiopaedia 病例：ANS 骨折）", "https://radiopaedia.org/articles/nasal-septal-cartilage（Radiopaedia：Nasal septal cartilage；隔軟骨最前下方以疏鬆纖維連到前鼻棘；2022-01-02 修訂）", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10411220/（Park 2023 Arch Plast Surg 50(4)：單獨 ANS 骨折）", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8827572/（JNMA 2019：顎平面 ANS–PNS）", "https://med.libretexts.org/Bookshelves/Anatomy_and_Physiology/Atlas_of_Otolaryngology_Head_and_Neck_Operative_Surgery/04:_Rhinology/4.13:_Septoplasty_in_Rhinoplasty_Surgery（Otten & Fagan：Septoplasty in Rhinoplasty Surgery）", "https://3d-craneometric-landmarks.manual.skeleton-id.com/en/v4（Skeleton·ID 手冊：subspinale）", "https://www.iitg.ac.in/cseweb/vlab/anthropology/Theory_indices.html（IIT Guwahati：nasospinale）", "https://www.columbia.edu/itc/hs/medical/humanAnatomy/yuan/craniologyISlides.pdf（Yuan 2003：傳統正中點清單）", "https://en.wiktionary.org/wiki/acanthion（輔助：acanthion 兩種定義）", "https://en.wikipedia.org/wiki/Anterior_nasal_spine（輔助：上頷間縫、人中最上端）"]}, "cdc": {"zh": "髁管", "en": "condylar canal", "abbr": "cdc", "aliases": ["condylar canal", "condyloid canal", "posterior condylar canal", "posterior condyloid foramen", "canalis condylaris", "canalis condylicus", "髁管", "後髁管"], "bilateral": true, "region": "顱底", "bones": ["枕骨（外側部）"], "definition": "枕骨外側部的一條小骨管，外口開在枕髁後上方的髁窩（condylar fossa）底部（Matsushima 1998；TeachMeAnatomy），是顱骨最大的導孔之一（Ginsberg 1994）。管內走後髁導靜脈（posterior condylar emissary vein；樂詞網把 condylar emissary vein 譯為「髁部導靜脈」），把顱內的乙狀竇接到顱外的枕下靜脈叢（Moore）；Moore 的顱底孔洞表在髁管只列這條導靜脈，沒有神經（Moore Table 8.2）。它不恆定，可能雙側、單側或完全沒有（Moore；Lachkar 2019）。", "howToFind": "把模型翻到顱底，由下往上看。先找枕骨大孔（見網站 ba、o 教材），孔的左右各有一個大突起，就是和寰椎相接的枕髁（Moore）。枕髁後上方的凹窩是髁窩（Matsushima 1998；TeachMeAnatomy），髁管外口就開在窩底（Matsushima 1998）；泰國 200 個頭骨中，外口最常對著枕髁後緣的外側 1/3（41.4%；Sae-Lim 2026）。實物外口平均約 3.8 mm（Sae-Lim 2026），在模型上只是窩底一個小孔，比枕骨大孔小得多；模型尺寸沒有校正，只看相對位置，不要量公分。左右以頭骨自己的左右為準：從顱底往上看、臉朝畫面上方時，頭骨的右側在畫面左邊（標點提醒）。它常常缺如，這一側找不到就不標。手機掃描的塑膠頭骨顱底常掃不完整，窩底的陰影在貼圖上很像孔：開著貼圖找到候選位置後，關掉貼圖、轉幾個角度，確認網格上真的有往內延伸的洞，而不是淺凹或黑色貼圖，再把點標在外口中心。看得到顱內的話，可在乙狀竇溝末端、頸靜脈孔附近找對應的內口，確認管有貫通（Matsushima 1998；Sae-Lim 2026），但點一律標在顱外的外口。", "anatomy": "髁窩在頭後仰時和寰椎的上關節面相接（TeachMeAnatomy）。髁管內端往前通到乙狀竇溝末端、頸靜脈孔或舌下神經管（Matsushima 1998），泰國 200 個頭骨以開在頸靜脈孔內最多（46.6%；Sae-Lim 2026）。後髁導靜脈連接乙狀竇與枕下靜脈叢（Moore）；Moore 的孔洞表寫成「從乙狀竇到頸部的椎靜脈」（Moore Table 8.2），枕下靜脈叢本身則由頸深靜脈與椎靜脈引流（Moore）。另有作者描述它通常起自頸靜脈球上部、偶爾起自乙狀竇下端，穿過髁管後流進頸深靜脈，並和椎動脈水平段周圍的靜脈叢相通（Natsis 2015）。導靜脈連接硬腦膜靜脈竇與顱外靜脈，沒有瓣膜，血流通常離腦、但兩個方向都能流，大小與數目因人而異（Moore）；靜脈竇本身也沒有瓣膜，乙狀竇接續橫竇，穿過頸靜脈孔後延續為頸內靜脈（TeachMeAnatomy；Moore）。Moore 圖 8.33 把枕骨大孔、乳突孔和髁管並列為椎外靜脈系統通往顱內靜脈竇的通道（Moore）。Radiopaedia 與 Su 2025 說枕動脈的腦膜支也走髁管，Moore 則把枕動脈腦膜支寫在乳突孔（Moore Table 8.2），此點未驗證。", "clinical": "導靜脈讓顱外靜脈與硬腦膜靜脈竇相通，是感染擴散進顱內的潛在危險通道（Moore，原文以臉與頭皮的靜脈為例）。影像上，髁管在 CT 上位置固定、容易認，把它當成腦靜脈的替代引流路徑來認識，可避免誤讀（Ginsberg 1994）；它的大小與位置多變，可能被當成病灶（Shmarhalov 2025），例如誤判為頸靜脈球腫瘤（glomus jugulare tumor），導致不必要的手術（Lachkar 2019）。手術上，枕骨大孔的外側入路（如 far-lateral、transcondylar fossa approach）以髁窩、髁管與後髁導靜脈作為術中定位標記（Matsushima 1998）；不慎傷到這些導靜脈可能大出血 const REGION_ORDER = ['顏面・眼眶', '顏面・鼻', '顏面・上頷', '顱頂', '枕部', '顱底', '側面', '下頷', '自訂構造'];
const SIDE_TEXT = { L: '左側', R: '右側', M: '中線' };

const baseCode = code => String(code).replace(/_(L|R)$/, '');
// 自訂點（例如「Pterion_R」「Mental foramen_R」）沒有內建代號：改用名稱對內建講解的英文名、中文名、代號與別名
const normalizeName = name => String(name || '').toLowerCase().replace(/[_\-]+/g, ' ')
  .replace(/\s*[（(]?\s*(左|右|left|right)\s*[)）]?\s*$/, '').replace(/\s+(l|r)$/, '').replace(/^(左|右)\s*/, '').replace(/\s+/g, ' ').trim();
const KB_BY_NAME = (() => {
  const map = {};
  for (const [code, entry] of Object.entries(SKULL_KB)) {
    for (const key of [code, entry.abbr, entry.en, entry.zh, ...(entry.aliases || [])]) if (key) map[normalizeName(key)] = code;
  }
  return map;
})();
const kbOf = definition => SKULL_KB[baseCode(definition.code)] || SKULL_KB[KB_BY_NAME[normalizeName(definition.name)]] || null;
const regionOf = definition => kbOf(definition)?.region || '自訂構造';
const EXPLAINERS = [
  definition => { const kb = kbOf(definition); return kb ? { source: 'kb', ...kb } : null; },
  definition => (definition.teach || definition.desc) ? { source: 'annotation' } : null,
];
function explain(definition) {
  for (const provider of EXPLAINERS) { const result = provider(definition); if (result) return result; }
  return null;
}

// ---------- 開教材 ----------
async function openLesson(buffer, fileName, doc, libraryModel = null) {
  setLoading(true, '正在讀取教材…', fileName);
  try {
    const previous = lesson.model, model = await loadModelBuffer(buffer, fileName);
    if (doc.modelGeometryHash && doc.modelGeometryHash !== model.hash) throw new Error('這份標註不是在這個模型上標的（網格指紋不同）');
    disposeModel(previous);
    setMaterialMode(model, lesson.mode, 1);
    const rows = Array.isArray(doc.transform?.matrix) && doc.transform.matrix.length === 4 ? doc.transform.matrix : makeTransform(1, null);
    setModelTransform(rows);
    const defs = (doc.landmarkDefinitions || []).filter(definition => doc.landmarks?.[definition.code] && markModelPosition(model, doc.landmarks[definition.code]));
    Object.assign(lesson, { model, libraryModel, doc, rows, defs, selected: '', pending: {} });
    frameModel(false);
    setLoading(false);
    renderLesson();
    toast(`已開啟教材「${doc.name || fileName}」：${defs.length} 個標記點`);
  } catch (error) { failLoading('教材讀取失敗', error?.message || String(error)); }
}

async function openLibraryLesson(model, setName) {
  const name = setName || currentSet(model)?.name;
  if (!name) return toast('這個模型還沒有標好的教材，先到標註頁標好並存檔', 'warn');
  setLoading(true, `正在讀取「${model.title}」…`, `${model.fileName}（${model.sizeMB} MB）`);
  try {
    const [buffer, doc] = await Promise.all([fetchModelBuffer(model), fetchLandmarkSet(model, name)]);
    doc.name = name; // 顯示檔名：換檔（同名覆蓋）就是換教材，名稱跟模型庫一致
    try { localStorage.setItem(LAST_LESSON_KEY, JSON.stringify({ id: model.id, setName: name })); } catch { /* 記不住也沒關係 */ }
    await openLesson(buffer, model.fileName, doc, model);
  } catch (error) { failLoading('教材讀取失敗', error?.message || String(error)); }
}

// 直接開檔（file://）：模型與標註 JSON 兩個都到齊才開
async function takeFiles(files) {
  for (const file of files) {
    if (/\.(glb|gltf)$/i.test(file.name)) lesson.pending.model = { buffer: await file.arrayBuffer(), fileName: file.name };
    else if (/\.json$/i.test(file.name)) {
      try { lesson.pending.doc = JSON.parse(await file.text()); lesson.pending.doc.name ||= file.name.replace(/\.json$/i, ''); }
      catch { return toast(`${file.name} 不是合法的 JSON`, 'bad'); }
    }
  }
  const { model, doc } = lesson.pending;
  if (model && doc) return openLesson(model.buffer, model.fileName, doc);
  toast(model ? '模型到了，再開一份標註 JSON' : doc ? '標註到了，再開對應的 .glb 模型' : '只接受 .glb 與 .json', model || doc ? 'ok' : 'bad');
}

// ---------- 場景 ----------
function pinPosition(code) {
  const p = markModelPosition(lesson.model, lesson.doc.landmarks[code]);
  return p ? applyTransform(lesson.rows, p) : null;
}
function drawLessonPins() {
  const pins = lesson.defs.map(definition => ({ code: definition.code, position: pinPosition(definition.code),
    normal: markOutputNormal(lesson.model, lesson.doc.landmarks[definition.code], lesson.rows), active: definition.code === lesson.selected }));
  drawPins(pins.filter(pin => pin.position), sceneRadius * 0.014, lesson.labels);
  const lines = [];
  for (const measurement of relatedMeasurements(lesson.selected)) {
    const points = measurement.points.map(pinPosition);
    if (!points.every(Boolean)) continue;
    lines.push({ from: points[0], to: points[1], kind: 'measure' });
    if (measurement.type === 'angle') lines.push({ from: points[1], to: points[2], kind: 'measure' });
  }
  drawLines(lines);
}
function relatedMeasurements(code) {
  if (!code) return [];
  const values = new Map((lesson.doc.measurements || []).map(item => [item.code, item]));
  return (lesson.doc.measurementDefinitions || []).filter(item => item.points?.includes(code)).map(item => ({ ...item, value: values.get(item.code)?.value, unit: values.get(item.code)?.unit }));
}

function select(code, fly = true) {
  lesson.selected = code;
  drawLessonPins(); renderList(); renderCard();
  const position = code && pinPosition(code);
  if (fly && position) flyTo(position, markOutputNormal(lesson.model, lesson.doc.landmarks[code], lesson.rows));
}
function step(direction) {
  const order = orderedDefs();
  if (!order.length) return;
  const index = order.findIndex(item => item.code === lesson.selected);
  select(order[(index + direction + order.length) % order.length].code);
}
function orderedDefs() {
  return [...lesson.defs].sort((a, b) => REGION_ORDER.indexOf(regionOf(a)) - REGION_ORDER.indexOf(regionOf(b)));
}

// ---------- 畫面 ----------
function renderLesson() {
  const { doc, libraryModel, model } = lesson;
  $('modelName').textContent = model ? `${libraryModel?.title || model.fileName} · 教材「${doc.name || ''}」` : '尚未選擇教材';
  $('sensitiveBanner').classList.toggle('hidden', !libraryModel?.sensitive);
  $('dropzone').classList.toggle('hidden', !!model);
  $('frameBadge').classList.toggle('hidden', !model);
  if (model) $('frameBadge').innerHTML = `<b>${doc.transform?.alignment?.enabled ? '法蘭克福方向' : '原始方向'}</b><span>${doc.units === 'mm' ? 'mm（已校正比例）' : '未校正比例'}</span>`;
  $('lessonHead').innerHTML = model ? `<strong>${escapeHtml(doc.name || '教材')}</strong><small>${lesson.defs.length} 個點${doc.annotator ? ` · 標註者 ${escapeHtml(doc.annotator)}` : ''}${doc.exportedAt ? ` · ${escapeHtml(formatSavedAt(doc.exportedAt))}` : ''}</small>` : '<strong>學習模式</strong><small>選一份標好的教材開始</small>';
  drawLessonPins(); renderList(); renderCard();
}

function renderList() {
  const groups = new Map();
  for (const definition of orderedDefs()) {
    const region = regionOf(definition);
    if (!groups.has(region)) groups.set(region, []);
    groups.get(region).push(definition);
  }
  $('learnList').innerHTML = [...groups].map(([region, items]) => `<div class="regionGroup"><h4>${escapeHtml(region)}</h4><div class="setChips">${items.map(definition => {
    const kb = kbOf(definition), title = kb ? `${kb.zh}${definition.side && definition.side !== 'M' ? `（${definition.side === 'L' ? '左' : '右'}）` : ''}` : (definition.name || definition.code);
    return `<button class="chip${definition.code === lesson.selected ? ' activeChip' : ''}" data-code="${escapeHtml(definition.code)}">${escapeHtml(title)}</button>`;
  }).join('')}</div></div>`).join('') || '<p class="note">這份教材沒有可以顯示的點。</p>';
  $('learnList').querySelectorAll('[data-code]').forEach(button => button.onclick = () => select(button.dataset.code));
}

const section = (title, body) => body ? `<section><h4>${title}</h4>${body}</section>` : '';
const paragraph = text => text ? `<p>${escapeHtml(text)}</p>` : '';

function renderCard() {
  const card = $('learnCard'), definition = lesson.defs.find(item => item.code === lesson.selected);
  if (!lesson.model) { card.innerHTML = `<p class="note">${hasCatalog() ? '按左上「選擇教材」挑一份標好的模型。' : '雙擊「啟動標註器.bat」可以用模型庫；或按「選擇教材」開 .glb，再按「開啟標註 JSON」。'}</p>`; return; }
  if (!definition) { card.innerHTML = overviewHtml(); return; }
  const info = explain(definition) || {}, kb = info.source === 'kb' ? info : null;
  const side = SIDE_TEXT[definition.side] || '';
  const header = kb
    ? `<header><h3>${escapeHtml(kb.zh)} <span class="en">${escapeHtml(kb.en)}</span></h3><div class="tags"><span class="badge">${escapeHtml(definition.code)}</span>${side ? `<span class="badge">${side}</span>` : ''}<span class="badge">${escapeHtml(kb.region)}</span></div>${kb.bones?.length ? `<p class="bones">${kb.bones.map(escapeHtml).join('・')}</p>` : ''}</header>`
    : `<header><h3>${escapeHtml(definition.name || definition.code)}</h3><div class="tags"><span class="badge">${escapeHtml(definition.code)}</span>${side ? `<span class="badge">${side}</span>` : ''}<span class="badge">自訂構造</span></div></header>`;
  const measurements = relatedMeasurements(definition.code).map(item => `<li>${escapeHtml(item.name)}${item.martin ? `（${escapeHtml(item.martin)}）` : ''}：${item.value == null ? '<span class="muted">另一端還沒標</span>' : `<b>${Number(item.value).toFixed(1)}${item.unit === 'deg' ? '°' : item.unit === 'mm' ? ' mm' : ' 單位'}</b>`}</li>`).join('');
  const exam = (kb?.examPoints || []).map(item => `<li>${escapeHtml(item.text)}${item.source ? `<small>${escapeHtml(item.source)}</small>` : ''}</li>`).join('');
  card.innerHTML = header
    + section('定義', paragraph(kb?.definition || definition.desc))
    + section('在模型上怎麼找', paragraph(kb?.howToFind))
    + section('解剖意義', paragraph(kb?.anatomy))
    + section('臨床意義', paragraph(kb?.clinical))
    + section('國考考點', exam ? `<ul>${exam}</ul>` : '')
    + section('常見標錯', paragraph(kb?.pitfalls))
    + section('這份教材的量測', measurements ? `<ul>${measurements}</ul>` : '')
    + section('相關量測與平面', kb?.relatedMeasurements?.length ? `<p>${kb.relatedMeasurements.map(escapeHtml).join('、')}</p>` : '')
    + section('標註者補充', paragraph(definition.teach))
    + (!kb && !definition.desc && !definition.teach ? '<p class="note">標註者還沒幫這個點寫說明：到標註頁點「編輯資料」填「教學說明」。</p>' : '')
    + (kb?.sources?.length ? `<footer class="sources">出處：${kb.sources.map(escapeHtml).join('；')}</footer>` : '')
    + (lesson.config.explainApi ? '<div class="apiBox"><button class="btn" id="askApi">延伸說明</button><div id="apiAnswer"></div></div>' : '')
    + '<div class="cardNav"><button class="btn" id="prevPoint">← 上一個</button><button class="btn" id="nextPoint">下一個 →</button></div>';
  $('prevPoint').onclick = () => step(-1);
  $('nextPoint').onclick = () => step(1);
  if ($('askApi')) $('askApi').onclick = () => askApi(definition);
}

function overviewHtml() {
  const rows = (lesson.doc.measurements || []).filter(item => item.value != null)
    .map(item => `<tr><td>${escapeHtml(item.name)}</td><td class="value">${Number(item.value).toFixed(1)}${item.unit === 'deg' ? '°' : item.unit === 'mm' ? ' mm' : ''}</td></tr>`).join('');
  return `<header><h3>${escapeHtml(lesson.doc.name || '教材')}</h3></header>
    <p>點模型上的圖釘或上面的名稱，鏡頭會飛過去並顯示講解；鍵盤 ← → 可以依部位順序逐點看。</p>
    ${rows ? `<section><h4>這份教材的量測結果</h4><table>${rows}</table></section>` : ''}
    <p class="note">${escapeHtml(lesson.doc.coordinateSystem || '')}</p>`;
}

// 預留的 API：只送名稱與內建講解（不送任何影像），回傳 {text}
async function askApi(definition) {
  $('apiAnswer').textContent = '詢問中…';
  try {
    const response = await fetch(lesson.config.explainApi, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: lesson.libraryModel?.title || lesson.model.fileName, landmark: { code: definition.code, name: definition.name }, reference: explain(definition) }) });
    const payload = await response.json();
    $('apiAnswer').textContent = payload.text || payload.answer || JSON.stringify(payload);
  } catch (error) { $('apiAnswer').textContent = `延伸說明取得失敗：${error.message}`; }
}

// ---------- 事件與啟動 ----------
let pointerStart = null;
// 觸控：兩指以上（縮放、平移）整段手勢都不算點選；手指點一下會微微移動，容許 12px
let activePointers = 0, multiTouch = false;
renderer.domElement.addEventListener('pointerdown', event => {
  activePointers += 1;
  if (activePointers > 1) multiTouch = true;
  pointerStart = activePointers === 1 ? { x: event.clientX, y: event.clientY } : null;
});
renderer.domElement.addEventListener('pointercancel', () => { pointerStart = null; activePointers = Math.max(0, activePointers - 1); if (!activePointers) multiTouch = false; });
renderer.domElement.addEventListener('pointerup', event => {
  activePointers = Math.max(0, activePointers - 1);
  const gesture = multiTouch;
  if (!activePointers) multiTouch = false;
  const moved = pointerStart ? Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) : Infinity;
  pointerStart = null;
  if (gesture || moved > (event.pointerType === 'touch' ? 12 : 5) || !lesson.model) return;
  const code = pinAt(event.clientX, event.clientY);
  if (code) select(code);
});
renderer.domElement.addEventListener('contextmenu', event => event.preventDefault());
document.querySelectorAll('[data-view]').forEach(button => button.onclick = () => setView(button.dataset.view));
$('openModel').onclick = () => hasCatalog() ? openLibrary(lesson.libraryModel?.id || '', { requireSets: true }) : $('modelFile').click();
$('modelFile').onchange = event => { const files = [...event.target.files]; event.target.value = ''; takeFiles(files); };
$('importJson').onclick = () => $('importFile').click();
$('importFile').onchange = event => { const files = [...event.target.files]; event.target.value = ''; takeFiles(files); };
$('loadingClose').onclick = () => setLoading(false);
$('labels').onchange = event => { lesson.labels = event.target.checked; if (lesson.model) drawLessonPins(); };
$('displayMode').onchange = event => { lesson.mode = event.target.value; if (lesson.model) setMaterialMode(lesson.model, lesson.mode, 1); };
addEventListener('dragover', event => { event.preventDefault(); $('stage').classList.add('dragging'); });
addEventListener('dragleave', event => { if (!event.relatedTarget) $('stage').classList.remove('dragging'); });
addEventListener('drop', event => { event.preventDefault(); $('stage').classList.remove('dragging'); takeFiles([...(event.dataTransfer?.files || [])]); });
addEventListener('keydown', event => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if (event.key === 'Escape') { closeLibrary(); return; }
  if (event.key === 'ArrowRight') { event.preventDefault(); step(1); }
  if (event.key === 'ArrowLeft') { event.preventDefault(); step(-1); }
});
library.onPick = (model, setName) => openLibraryLesson(model, setName);
library.onOpenFile = () => $('modelFile').click();
bindLibraryModal();

(async () => {
  renderLesson();
  await loadCatalog();
  $('openModel').textContent = hasCatalog() ? '選擇教材' : '開啟模型';
  $('importJson').classList.toggle('hidden', library.server);
  if (new URLSearchParams(location.search).has('debug')) window.__learn = { lesson, select, library };
  if (!hasCatalog()) return;
  if (library.server) try { lesson.config = await (await fetch('/api/config', { cache: 'no-store' })).json(); } catch { /* 沒有設定就不開延伸說明 */ }
  let last = null;
  try { last = JSON.parse(localStorage.getItem(LAST_LESSON_KEY) || 'null'); } catch { /* 無 */ }
  const model = library.models.find(item => item.id === last?.id && currentSet(item));
  if (model) openLibraryLesson(model, currentSet(model).name); // 一律開目前版本：上次看的那份可能已經封存
  else openLibrary('', { requireSets: true });
})();
</script>
</body>
