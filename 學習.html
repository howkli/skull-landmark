<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>頭骨解剖學習</title>
<style>:root {
  --bg: #e7eceb; --panel: #ffffff; --ink: #1d2624; --muted: #5f6d6a; --line: #d6dedc; --soft: #f3f6f5;
  --accent: #0d9bb5; --accent-soft: #e2f4f7; --pin: #e65d32; --cal: #7b5cd6;
  --warn: #b3541e; --warn-soft: #fcefe6; --bad: #b42318; --ok: #1a7a3e;
  --radius: 8px; --shadow: 0 6px 22px rgba(20, 40, 38, .14);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
.topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: #fff; font-weight: 700; letter-spacing: .5px; flex: none; }
.brandText { display: flex; flex-direction: column; min-width: 0; }
.brandText strong { font-size: 15px; }
.brandText small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
.tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: #aebbb8; background: var(--soft); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #33403d; }
.btn.place { border-color: var(--accent); color: #07667a; background: var(--accent-soft); }
.btn.add { border-style: dashed; }
.btn.danger { color: var(--bad); }
.linkBtn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
.linkBtn:hover { color: var(--bad); }
.fileTarget { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.fileTarget span { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.fileTarget input { border: 0; padding: 5px 8px; width: 120px; outline: none; }
.fileTarget b { font-weight: 400; color: var(--muted); padding-right: 8px; }
.saveState { font-size: 12px; color: var(--ok); min-width: 120px; }
.saveState.dirty { color: var(--warn); }

.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 390px; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.stage.dragging::after { content: "放開就載入"; position: absolute; inset: 12px; border: 3px dashed var(--accent); border-radius: 14px; display: grid; place-items: center; font-size: 20px; color: #07667a; background: rgba(226, 244, 247, .7); pointer-events: none; }
#viewer { position: absolute; inset: 0; }
#viewer canvas { display: block; width: 100%; height: 100%; }
.labelLayer { position: absolute; inset: 0; pointer-events: none; }
.pinLabel { font: 600 11px/1.2 ui-monospace, Consolas, monospace; color: #8a3a1c; background: rgba(255, 255, 255, .86); border: 1px solid rgba(230, 93, 50, .35); padding: 1px 4px; border-radius: 4px; white-space: nowrap; }
.pinLabel.active { color: #07667a; border-color: rgba(13, 155, 181, .6); }
.pinLabel.behind { opacity: .16; }
select.btn { padding: 5px 8px; }
.annotatorRow select { flex: 1; border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; min-width: 0; }

.views { position: absolute; top: 12px; left: 12px; display: flex; gap: 4px; background: rgba(255, 255, 255, .92); padding: 4px; border-radius: 9px; box-shadow: var(--shadow); }
.views button { border: 0; background: none; width: 34px; height: 30px; border-radius: 6px; cursor: pointer; }
.views button:hover { background: var(--accent-soft); }
.displayControls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; background: rgba(255, 255, 255, .94); padding: 10px 12px; border-radius: 9px; box-shadow: var(--shadow); font-size: 12.5px; }
.displayControls label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.displayControls input[type=range] { width: 110px; }
.displayControls select { padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; }
.check { display: flex; align-items: center; gap: 6px; }
.frameBadge { position: absolute; left: 12px; top: 56px; display: flex; gap: 10px; align-items: center; background: rgba(255, 255, 255, .92); padding: 5px 10px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow); }
.warnText { color: var(--warn); font-weight: 600; }
.stageHint { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: center; background: rgba(29, 38, 36, .82); color: #fff; padding: 8px 12px; border-radius: 9px; font-size: 12.5px; }
.stageHint b { white-space: nowrap; }
.stageHint.placing { background: rgba(7, 102, 122, .9); }
.dropzone, .loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.dropzone > div, .loading > div { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; max-width: 380px; background: rgba(255, 255, 255, .95); padding: 22px 26px; border-radius: 14px; box-shadow: var(--shadow); }
.dropzone b { font-size: 17px; }
.dropzone small, .loading small { color: var(--muted); }
.loading { background: rgba(231, 236, 235, .55); pointer-events: auto; }
.loading.error b { color: var(--bad); }

.panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 6px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabPane { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px 16px; }
#tab-landmarks { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.annotatorRow { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.annotatorRow input { flex: 1; border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
.progressHead { display: flex; justify-content: space-between; font-size: 13px; }
.progressTrack { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; flex: none; }
.progressTrack i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.list { flex: 1; min-height: 120px; overflow: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 2px; }
.landmark { display: grid; grid-template-columns: 28px minmax(0, 1fr) 20px; align-items: center; gap: 8px; text-align: left; border: 1px solid transparent; background: var(--soft); border-radius: 7px; padding: 5px 8px; cursor: pointer; }
.landmark:hover { border-color: var(--line); }
.landmark.active { border-color: var(--accent); background: var(--accent-soft); }
.landmark .num { color: var(--muted); font-size: 12px; text-align: right; }
.landmark .label { display: flex; flex-direction: column; min-width: 0; }
.landmark .label b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.landmark .label small { color: var(--muted); font-size: 11.5px; }
.landmark .check { color: var(--muted); text-align: center; }
.landmark.done .check { color: var(--ok); font-weight: 700; }
.current { flex: none; border-top: 1px solid var(--line); padding-top: 10px; }
.currentHead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.badge { font-size: 11.5px; background: var(--soft); border-radius: 99px; padding: 1px 8px; color: var(--muted); white-space: nowrap; }
.description { margin: 6px 0; font-size: 13px; color: #33403d; }
.caution { margin: 6px 0; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); padding: 5px 8px; border-radius: 6px; }
.coords { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; }
.coords div { background: var(--soft); border-radius: 6px; padding: 3px 6px; display: flex; gap: 6px; font-size: 12px; }
.coords span { color: var(--muted); }
.meta { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.currentActions { display: flex; gap: 6px; flex-wrap: wrap; }

.calSection { border-top: 1px solid var(--line); padding: 10px 0 4px; }
.calSection:first-child { border-top: 0; padding-top: 0; }
.calSection h3 { font-size: 14px; margin: 0 0 4px; }
.note { font-size: 12.5px; color: var(--muted); margin: 4px 0 8px; }
.summary { font-size: 13px; margin: 6px 0; }
.muted { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 4px; }
td { border-bottom: 1px solid var(--soft); padding: 5px 4px; vertical-align: top; }
td small { display: block; color: var(--muted); font-size: 11px; }
td.value { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.measure tbody tr { cursor: pointer; }
table.measure tbody tr:hover { background: var(--soft); }
table.measure tr.highlight { background: var(--accent-soft); }
.pairForm, .measureForm { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.pairForm select, .measureForm select, .measureForm input, .pairForm input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; }
.pairForm select { flex: 1 1 120px; }
.pairForm input { width: 90px; }
.measureForm input, .measureForm select { flex: 1 1 140px; }
.fhRow { display: grid; grid-template-columns: 72px minmax(0, 1fr) 44px; gap: 6px; align-items: center; margin: 4px 0; font-size: 13px; }
.fhRow select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; min-width: 0; }
.fhRow i { font-style: normal; font-size: 12px; text-align: center; }
.fhRow i.ok { color: var(--ok); }
.fhRow i.miss { color: var(--warn); }
#toggleAlign { margin: 6px 0; }

.toast { position: fixed; left: 50%; bottom: 78px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 9px; box-shadow: var(--shadow); transition: .2s; pointer-events: none; max-width: 80vw; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.warn { background: var(--warn); }
.toast.bad { background: var(--bad); }
.modal { position: fixed; inset: 0; background: rgba(20, 30, 28, .38); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modalCard { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); width: min(560px, 100%); padding: 16px 18px; }
.modalHead { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.modalHead > div { display: flex; flex-direction: column; }
.modalHead small { color: var(--muted); font-size: 12px; }
.modalHead button { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
.formGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.formGrid label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.formGrid label.wide { grid-column: 1 / -1; }
.formGrid input, .formGrid select, .formGrid textarea { border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
.formGrid small { color: var(--muted); font-size: 11.5px; }
.modalActions { display: flex; gap: 8px; margin-top: 14px; }
.modalActions span { flex: 1; }

.presetNotice { font-size: 12.5px; background: var(--accent-soft); color: #07667a; border-radius: 8px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }

/* 頁面切換與模型庫（兩頁共用） */
.pageNav { display: flex; gap: 2px; background: var(--soft); padding: 3px; border-radius: 9px; }
.pageNav a { padding: 4px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 13.5px; }
.pageNav a.active { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(20, 40, 38, .15); }
.pageNav a:hover:not(.active) { color: var(--ink); }
.modalCard.wideCard { width: min(760px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
.libraryList { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; overflow: auto; padding: 2px; }
.modelCard { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.modelCard:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(13, 155, 181, .12); }
.modelCard.active { border-color: var(--accent); background: var(--accent-soft); }
.modelCard p { margin: 0; font-size: 13px; color: #33403d; }
.modelCard small { color: var(--muted); font-size: 12px; }
.modelTop { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.modelTop b { font-size: 14.5px; margin-right: 4px; }
.warnBadge { background: var(--warn-soft); color: var(--warn); }
.setChips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--accent); color: #07667a; background: var(--panel); border-radius: 99px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.chip:hover { background: var(--accent-soft); }
.archivedSets { font-size: 12px; color: var(--muted); }
.archivedSets summary { cursor: pointer; margin-bottom: 6px; }
.chip.archivedChip { border-color: var(--line); color: var(--muted); }
.sensitiveBanner { position: absolute; bottom: 64px; left: 12px; background: rgba(179, 84, 30, .92); color: #fff; padding: 4px 12px; border-radius: 8px; font-size: 12px; box-shadow: var(--shadow); z-index: 2; max-width: calc(100% - 24px); }

/* 觸控裝置（手機、平板）：提示改觸控用語 */
.hintTouch { display: none; }
@media (pointer: coarse) { .hintMouse { display: none; } .hintTouch { display: inline; } }
/* 外觀設定：桌面版一直展開；手機版收成一顆按鈕 */
.displayToggle { display: none; }

@media (max-width: 900px) {
  .workspace { grid-template-columns: 1fr; grid-template-rows: 62vh auto; overflow: auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); min-height: 60vh; }
  .displayControls { top: auto; bottom: 110px; }
  .tools { margin-left: 0; }
}

/* 手機（寬度 600px 以下）：工具列精簡、3D 畫面放大、外觀設定收合 */
@media (max-width: 600px) {
  .topbar { gap: 8px; padding: 6px 10px; }
  .brandText small { max-width: 210px; }
  .tools { gap: 4px; }
  .btn { padding: 4px 8px; font-size: 13px; }
  .workspace { grid-template-rows: 68vh auto; }
  .views button { width: 30px; height: 28px; }
  .displayControls { top: 12px; bottom: auto; right: 8px; padding: 6px 9px; font-size: 12px; }
  .displayToggle { display: block; border: 0; background: none; font: inherit; font-weight: 600; color: inherit; padding: 2px 0; text-align: left; cursor: pointer; }
  .displayControls:not(.open) > label { display: none; }
  .displayControls input[type=range] { width: 80px; }
  .stageHint { left: 8px; right: 8px; bottom: 8px; gap: 8px; padding: 6px 10px; font-size: 12px; }
}

/* 學習頁專用 */
.learnMark { background: #07667a; }
.learnSpace { grid-template-columns: minmax(0, 1fr) 440px; }
.learnPanel { display: flex; flex-direction: column; min-height: 0; }
.lessonHead { display: flex; flex-direction: column; padding: 12px 16px 8px; border-bottom: 1px solid var(--line); flex: none; }
.lessonHead strong { font-size: 15px; }
.lessonHead small { color: var(--muted); font-size: 12px; }
.learnList { flex: none; max-height: 34%; overflow: auto; padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.regionGroup h4 { margin: 2px 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.chip.activeChip { background: #07667a; border-color: #07667a; color: #fff; }
.learnCard { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px 18px; font-size: 14px; line-height: 1.7; }
.learnCard header h3 { margin: 0; font-size: 19px; }
.learnCard header .en { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.learnCard .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.learnCard .bones { margin: 4px 0 0; color: #33403d; font-size: 13px; }
.learnCard section { margin-top: 12px; }
.learnCard h4 { margin: 0 0 3px; font-size: 13px; color: #07667a; letter-spacing: .5px; }
.learnCard p { margin: 0; }
.learnCard ul { margin: 0; padding-left: 20px; }
.learnCard li small { display: block; color: var(--muted); font-size: 11.5px; }
.learnCard .sources { margin-top: 14px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--muted); }
.learnCard table td { font-size: 13px; }
.cardNav { display: flex; justify-content: space-between; margin-top: 16px; }
.apiBox { margin-top: 12px; padding: 8px 10px; background: var(--soft); border-radius: 8px; }
.apiBox div { margin-top: 6px; white-space: pre-wrap; font-size: 13px; }
@media (max-width: 900px) {
  .learnSpace { grid-template-columns: 1fr; }
  .learnList { max-height: none; }
}
</style>
<script>
  // 模組載不進來（多半是沒網路，three.js 在 jsdelivr）時，至少告訴使用者原因
  window.addEventListener('error', function (event) {
    var box = document.getElementById('loading');
    if (!box) return;
    box.className = 'loading error';
    document.getElementById('loadingText').textContent = '3D 程式載入失敗';
    document.getElementById('loadingDetail').textContent = String(event.message || '') + '（第一次開需要網路下載 three.js）';
  });
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark learnMark">SK</span><span class="brandText"><strong>頭骨解剖 學習模式</strong><small id="modelName">尚未選擇教材</small></span></div>
    <nav class="pageNav" aria-label="切換頁面"><a href="標註.html">標註</a><a class="active" href="學習.html">學習</a></nav>
    <div class="tools">
      <button class="btn primary" id="openModel">選擇教材</button><input id="modelFile" class="hidden" type="file" multiple accept=".glb,.gltf,.json,model/gltf-binary,application/json">
      <button class="btn" id="importJson">開啟標註 JSON</button><input id="importFile" class="hidden" type="file" accept="application/json,.json">
      <select class="btn" id="displayMode" aria-label="外觀"><option value="lit">照片貼圖</option><option value="unlit">貼圖原色</option><option value="plain">素色骨頭</option></select>
      <label class="check"><input id="labels" type="checkbox" checked> 顯示代碼</label>
    </div>
  </header>
  <main class="workspace learnSpace">
    <section class="stage" id="stage">
      <div id="viewer" aria-label="3D 模型"></div>
      <div class="views" aria-label="切換視角">
        <button data-view="front" title="正面 norma frontalis">前</button><button data-view="back" title="後面 norma occipitalis">後</button><button data-view="left" title="左側面 norma lateralis">左</button><button data-view="right" title="右側面">右</button><button data-view="top" title="上面 norma verticalis">上</button><button data-view="bottom" title="底面 norma basilaris">下</button>
      </div>
      <div class="sensitiveBanner hidden" id="sensitiveBanner">大體老師資料：僅限教學使用，請勿截圖外流或上傳到雲端與社群</div>
      <div class="frameBadge hidden" id="frameBadge"></div>
      <div class="loading hidden" id="loading"><div><b id="loadingText">載入中…</b><small id="loadingDetail"></small><button class="btn hidden" id="loadingClose">關閉</button></div></div>
      <div class="stageHint placing"><b>學習模式</b><span class="hintMouse">點圖釘或右邊的名稱看講解；左鍵拖曳旋轉、右鍵平移、滾輪縮放；← → 逐點看。</span><span class="hintTouch">點圖釘或名稱看講解；單指拖曳旋轉、雙指縮放與平移。</span></div>
      <div class="dropzone" id="dropzone"><div><b>選一份教材開始</b><small>教材＝模型＋一份在標註頁存好的標註。用模型庫時按「選擇教材」；直接開檔時，把 .glb 和對應的 .json 一起拖進來。</small></div></div>
    </section>
    <aside class="panel learnPanel">
      <div class="lessonHead" id="lessonHead"></div>
      <div class="learnList" id="learnList"></div>
      <article class="learnCard" id="learnCard"></article>
    </aside>
  </main>
</div>
<div class="modal hidden" id="libraryModal" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
  <div class="modalCard wideCard">
    <div class="modalHead"><div><strong id="libraryTitle">選擇模型</strong><small id="librarySubtitle"></small></div><button type="button" id="libraryClose" aria-label="關閉">×</button></div>
    <p class="note">點卡片開模型；點卡片裡的標註名稱，會連同那份標註一起開。</p>
    <div class="libraryList" id="libraryList"></div>
    <div class="modalActions"><button type="button" class="btn" id="libraryOpenFile">開啟電腦裡的檔案…</button><span></span><button type="button" class="btn" id="libraryRefresh">重新整理清單</button></div>

// 頭骨標註器的純數學：重心座標、法蘭克福座標系、比例校正、量測、網格雜湊。
// 刻意不碰 three.js，才能用 node 直接測（tests/geometry.test.mjs）。
// 座標一律是 [x, y, z] 陣列；矩陣一律是列優先的 4×4 巢狀陣列。

const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => Math.hypot(a[0], a[1], a[2]);
const distance = (a, b) => norm(sub(a, b));

function normalize(a) {
  const n = norm(a);
  if (!(n > 1e-12)) throw new Error('向量長度為零，無法定方向');
  return mul(a, 1 / n);
}

// 與 8078 的 barycentricForHit 同一套：投影到三角形平面，負值截成 0 再重新正規化。
// 退化判準改成相對值：8078 用 mm 座標、門檻 1e-12 沒問題，但照片重建的模型常是公尺，
// 百萬面等級的小三角形 den 會小於 1e-12 而被誤判成退化。
function barycentric(p, a, b, c) {
  const v0 = sub(b, a), v1 = sub(c, a), v2 = sub(p, a);
  const d00 = dot(v0, v0), d01 = dot(v0, v1), d11 = dot(v1, v1), d20 = dot(v2, v0), d21 = dot(v2, v1);
  const den = d00 * d11 - d01 * d01;
  if (!(d00 > 0) || !(d11 > 0) || Math.abs(den) <= 1e-12 * d00 * d11) return [1, 0, 0];
  const v = (d11 * d20 - d01 * d21) / den, w = (d00 * d21 - d01 * d20) / den, u = 1 - v - w;
  const clipped = [Math.max(0, u), Math.max(0, v), Math.max(0, w)];
  const sum = clipped[0] + clipped[1] + clipped[2];
  return sum > 0 ? clipped.map(value => value / sum) : [1, 0, 0];
}

function fromBarycentric(a, b, c, weights) {
  const [u, v, w] = weights;
  return [a[0] * u + b[0] * v + c[0] * w, a[1] * u + b[1] * v + c[1] * w, a[2] * u + b[2] * v + c[2] * w];
}

// 法蘭克福水平面座標系。輸入是模型座標的左右 porion 與一側 orbitale。
// 輸出軸（右手座標）：+X 往受試者左側、+Y 往上、+Z 往前；原點在兩側 porion 中點。
// FH 平面就是 Y = 0；X = 0 是通過 porion 中點、垂直於耳點連線的近似正中矢狀面。
function frankfurtFrame(poL, poR, orbitale) {
  const origin = mul(add(poL, poR), 0.5);
  const x = normalize(sub(poL, poR));
  const toOrbitale = sub(orbitale, origin);
  const forward = sub(toOrbitale, mul(x, dot(toOrbitale, x)));
  if (norm(forward) < 1e-9 * Math.max(1, norm(toOrbitale))) throw new Error('orbitale 幾乎落在兩側 porion 的連線上，無法定出平面');
  const z = normalize(forward);
  const y = cross(z, x);
  return { origin, x, y, z };
}

// 輸出 = scale · R · (p − origin)，R 的三列是 frame 的 x、y、z 軸。沒有 frame 時只做等比縮放。
function makeTransform(scale, frame = null) {
  if (!frame) return [[scale, 0, 0, 0], [0, scale, 0, 0], [0, 0, scale, 0], [0, 0, 0, 1]];
  const row = axis => [...mul(axis, scale), -scale * dot(axis, frame.origin)];
  return [row(frame.x), row(frame.y), row(frame.z), [0, 0, 0, 1]];
}

function applyTransform(m, p) {
  return [0, 1, 2].map(i => m[i][0] * p[0] + m[i][1] * p[1] + m[i][2] * p[2] + m[i][3]);
}

// 游標卡尺校正：每組是「模型上兩點的距離」對「實物量到的 mm」。
// 最小平方的等比係數 s = Σ m·d / Σ d²；residuals 與輸入同序（無效的一組回 null）。
function fitScale(pairs) {
  const valid = pairs.filter(pair => pair.modelDistance > 0 && pair.measuredMm > 0);
  if (!valid.length) return null;
  const num = valid.reduce((total, pair) => total + pair.measuredMm * pair.modelDistance, 0);
  const den = valid.reduce((total, pair) => total + pair.modelDistance * pair.modelDistance, 0);
  const factor = num / den;
  const residuals = pairs.map(pair => (pair.modelDistance > 0 && pair.measuredMm > 0) ? factor * pair.modelDistance - pair.measuredMm : null);
  const used = residuals.filter(value => value !== null);
  const rms = Math.sqrt(used.reduce((total, value) => total + value * value, 0) / used.length);
  return { factor, residuals, rms, n: valid.length };
}

function angleDeg(a, vertex, c) {

function hashChunks(chunks, seed = 0) {

function extractPositions(geometry) {
  const attribute = geometry.getAttribute('position'), out = new Float32Array(attribute.count * 3);
  for (let i = 0; i < attribute.count; i++) {
    out[i * 3] = attribute.getX(i); out[i * 3 + 1] = attribute.getY(i); out[i * 3 + 2] = attribute.getZ(i);
  }
  return out;
}

// 面積加權形心（模型座標）：擺正後用來判斷頭骨有沒有上下顛倒
function areaCentroid(entries) {
  let total = 0; const acc = [0, 0, 0];
  for (const entry of entries) {
    const count = entry.faceCount;
    for (let f = 0; f < count; f++) {
      const [a, b, c] = faceVertices(entry, f).map(index => vertexModel(entry, index));
      const area = norm(cross(sub(b, a), sub(c, a))) / 2;
      total += area;
      for (let k = 0; k < 3; k++) acc[k] += area * (a[k] + b[k] + c[k]) / 3;
    }
  }
  return total > 0 ? acc.map(value => value / total) : [0, 0, 0];
}

async function loadModelBuffer(buffer, fileName) {
  const gltf = await parseGlb(buffer);
  const root = gltf.scene || gltf.scenes?.[0];
  if (!root) throw new Error('GLB 裡沒有場景');
  root.updateMatrixWorld(true); // 此時還沒掛到 modelRoot，matrixWorld 就是「模型座標」
  const entries = [], used = new Set();
  root.traverse(object => {
    if (!object.isMesh || !object.geometry?.getAttribute('position')) return;
    const base = String(object.name || 'mesh').trim().replace(/[^A-Za-z0-9._-]/g, '_') || 'mesh';
    let id = base, k = 0;
    while (used.has(id)) id = `${base}_${++k}`; // 同一個 mesh 拆成多個 primitive 時名字會重複
    used.add(id);
    const geometry = object.geometry, positions = extractPositions(geometry);
    if (!geometry.getAttribute('normal')) geometry.computeVertexNormals(); // OpenMVS 等輸出可能不帶法向量
    // indirect：BVH 另存一份排序，不去重排原本的三角面索引。
    // 預設模式會重排 index，網格指紋與 faceIndex 都會跟著變，舊草稿／JSON 就對不上了。
    geometry.computeBoundsTree({ indirect: true });
    const index = geometry.index ? geometry.index.array : null;
    const faceCount = index ? index.length / 3 : positions.length / 9;
    entries.push({ id, name: object.name || id, mesh: object, positions, index, faceCount, vertexCount: positions.length / 3,
      localToModel: object.matrixWorld.clone(), original: object.material, materials: {} });
  });
  if (!entries.length) throw new Error('GLB 裡沒有網格');
  const chunks = [];
  for (const entry of entries) {
    chunks.push(new Uint32Array([entry.vertexCount, entry.faceCount]), entry.positions);
    if (entry.index) chunks.push(entry.index);
  }
  const boxModel = new THREE.Box3().setFromObject(root);
  clearModel();
  modelRoot.add(root);
  // centroid 留到擺正時才算（百萬面等級一載入就算會卡）
  return { fileName, root, meshes: entries, hash: hashChunks(chunks), centroid: null,
    boxModel: { min: boxModel.min.toArray(), max: boxModel.max.toArray() } };
}

function disposeModel(model) {
  if (!model) return;
  for (const entry of model.meshes) {
    for (const material of Object.values(entry.materials)) (Array.isArray(material) ? material : [material]).forEach(item => item?.dispose?.());
  }
}

function disposeTree(object) {
  object.traverse(child => {
    if (!child.isMesh) return;
    child.geometry?.disposeBoundsTree?.();
    child.geometry?.dispose();
    (Array.isArray(child.material) ? child.material : [child.material]).forEach(material => material?.dispose());
  });
}
function clearModel() {
  while (modelRoot.children.length) { const child = modelRoot.children.pop(); disposeTree(child); }
}

// ---------- 幾何查詢（全部以 mark 的三角面＋重心座標為準） ----------
function faceVertices(entry, faceIndex) {
  return entry.index ? [entry.index[faceIndex * 3], entry.index[faceIndex * 3 + 1], entry.index[faceIndex * 3 + 2]] : [faceIndex * 3, faceIndex * 3 + 1, faceIndex * 3 + 2];
}
function vertexLocal(entry, index) {
  if (!(index >= 0 && index < entry.vertexCount)) throw new Error(`頂點編號 ${index} 超出網格範圍`);
  return [entry.positions[index * 3], entry.positions[index * 3 + 1], entry.positions[index * 3 + 2]];
}
const tempVector = new THREE.Vector3();
function toModel(entry, local) { return tempVector.set(local[0], local[1], local[2]).applyMatrix4(entry.localToModel).toArray(); }
function vertexModel(entry, index) { return toModel(entry, vertexLocal(entry, index)); }

// 回傳 mark 在模型座標的位置；網格對不上時回 null
function markModelPosition(model, mark) {
  const entry = model?.meshes.find(item => item.id === mark?.bone);
  if (!entry || !Array.isArray(mark.faceVertexIndices) || !Array.isArray(mark.barycentricWeights)) return null;
  try {
    const [a, b, c] = mark.faceVertexIndices.map(index => vertexLocal(entry, Number(index)));
    return toModel(entry, fromBarycentric(a, b, c, mark.barycentricWeights.map(Number)));
  } catch { return null; }
}

// 標記點的表面法向量（輸出座標、單位向量），用來判斷標籤是不是轉到背面。
// 三角面的繞行方向不一定朝外，所以用網格自帶的頂點法向量決定正負號。
function markOutputNormal(model, mark, rows) {
  const entry = model?.meshes.find(item => item.id === mark?.bone);
  if (!entry) return null;
  try {
    const local = mark.faceVertexIndices.map(index => vertexLocal(entry, Number(index)));
    let normal = cross(sub(local[1], local[0]), sub(local[2], local[0]));
    const attribute = entry.mesh.geometry.getAttribute('normal');
    if (attribute) {
      const vertexNormal = mark.faceVertexIndices.reduce((sum, index) => add(sum, [attribute.getX(index), attribute.getY(index), attribute.getZ(index)]), [0, 0, 0]);
      if (dot(normal, vertexNormal) < 0) normal = mul(normal, -1);
    }
    const origin = fromBarycentric(...local, mark.barycentricWeights.map(Number));
    const scale = Math.max(norm(sub(local[1], local[0])), 1e-9);
    const tip = add(origin, mul(normalize(normal), scale));
    const out = [origin, tip].map(point => applyTransform(rows, toModel(entry, point)));
    return normalize(sub(out[1], out[0]));
  } catch { return null; }
}

// ---------- 點選 ----------
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
raycaster.firstHitOnly = true; // three-mesh-bvh：只要最近的那一個交點
function raycastAt(model, clientX, clientY) {
  if (!model) return null;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const targets = model.meshes.filter(entry => entry.mesh.visible).map(entry => entry.mesh);
  return raycaster.intersectObjects(targets, false)[0] || null;
}

function hitToMark(model, hit) {
  const entry = model.meshes.find(item => item.mesh === hit.object);
  const faceVertexIndices = [hit.face.a, hit.face.b, hit.face.c];
  const local = hit.object.worldToLocal(hit.point.clone()).toArray();
  const corners = faceVertexIndices.map(index => vertexLocal(entry, index));
  const barycentricWeights = barycentric(local, ...corners);
  const snapped = fromBarycentric(...corners, barycentricWeights);
  let vertexIndex = faceVertexIndices[0], best = Infinity;
  corners.forEach((corner, i) => { const d = distance(corner, snapped); if (d < best) { best = d; vertexIndex = faceVertexIndices[i]; } });
  return { bone: entry.id, faceIndex: hit.faceIndex, faceVertexIndices, barycentricWeights, vertexIndex };
}

// ---------- 顯示 ----------
function setModelTransform(rows) {
  modelRoot.matrix.set(...rows.flat());
  modelRoot.matrixWorldNeedsUpdate = true;
  modelRoot.updateMatrixWorld(true);
}

function outputBox() { return new THREE.Box3().setFromObject(modelRoot); }

// 取景用的「主體範圍」：抽樣頂點取 3%–97% 分位數。整個場景（含周圍環境）都保留顯示，
// 但鏡頭對準大部分點所在的地方，遠處零星的環境碎片不會把主體擠成一小塊。
function focusBox() {
  const samples = [], point = new THREE.Vector3();
  const total = modelRoot.children.length ? countMeshes() : 0;
  modelRoot.updateMatrixWorld(true);
  modelRoot.traverse(object => {
    if (!object.isMesh) return;
    const position = object.geometry.getAttribute('position');
    const stride = Math.max(1, Math.floor(position.count / Math.max(1, 120000 / Math.max(1, total))));
    for (let i = 0; i < position.count; i += stride) samples.push(point.fromBufferAttribute(position, i).applyMatrix4(object.matrixWorld).toArray());
  });
  if (samples.length < 8) return outputBox();
  const box = new THREE.Box3();
  const quantile = (axis, q) => { const values = samples.map(p => p[axis]).sort((a, b) => a - b); return values[Math.floor(q * (values.length - 1))]; };
  box.min.set(quantile(0, 0.03), quantile(1, 0.03), quantile(2, 0.03));
  box.max.set(quantile(0, 0.97), quantile(1, 0.97), quantile(2, 0.97));
  return box;
}
function countMeshes() { let count = 0; modelRoot.traverse(object => { if (object.isMesh) count++; }); return count; }

// keepDirection：只改比例時保留目前視線方向；擺正後改回正面
function frameModel(keepDirection) {
  const box = focusBox(), whole = outputBox();
  if (box.isEmpty()) return;
  const direction = camera.position.clone().sub(controls.target);
  box.getCenter(viewCenter);
  sceneRadius = Math.max(box.getSize(tempVector).length() / 2, 1e-6);
  const wholeRadius = Math.max(whole.getSize(tempVector).length() / 2, sceneRadius);
  // 直式畫面的水平視角比垂直窄，取較窄的那個算距離，整顆才放得進畫面
  const verticalFov = THREE.MathUtils.degToRad(camera.fov), horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
  viewDistance = sceneRadius / Math.sin(Math.min(verticalFov, horizontalFov) / 2) * 0.92;
  camera.near = sceneRadius / 300; camera.far = (viewDistance + wholeRadius) * 4; camera.updateProjectionMatrix(); // far 要涵蓋整個場景，遠處環境才不會被裁掉
  controls.minDistance = sceneRadius * 0.12; controls.maxDistance = Math.max(sceneRadius * 12, wholeRadius * 3);
  keyLight.position.copy(viewCenter).add(new THREE.Vector3(-1.2, 2.2, 2.6).multiplyScalar(sceneRadius));
  keyLight.target.position.copy(viewCenter);
  if (keepDirection && direction.lengthSq() > 0) {
    controls.target.copy(viewCenter);
    camera.position.copy(viewCenter).add(direction.normalize().multiplyScalar(viewDistance));
    controls.update();
  } else setView('front');
}

// 右手座標、擺正後：+X 受試者左、+Y 上、+Z 前。上／下視角微偏，讓臉朝畫面上方。
const VIEW_DIRECTIONS = { front: [0, 0, 1], back: [0, 0, -1], left: [1, 0, 0], right: [-1, 0, 0], top: [0, 1, -0.002], bottom: [0, -1, 0.002] };
function setView(name) {
  const direction = new THREE.Vector3(...(VIEW_DIRECTIONS[name] || VIEW_DIRECTIONS.front)).normalize();
  controls.target.copy(viewCenter);
  camera.position.copy(viewCenter).add(direction.multiplyScalar(viewDistance));
  controls.update();
}

function focusAt(point) { controls.target.copy(point); controls.update(); }

// 鏡頭平滑飛到某一點：從該點表面法向量的方向、距離 distanceFactor×整體視距看過去
let flight = null;
function flyTo(point, normal, distanceFactor = 0.45, duration = 700) {
  const target = new THREE.Vector3(...point);
  const direction = normal ? new THREE.Vector3(...normal) : camera.position.clone().sub(controls.target);
  if (direction.lengthSq() === 0) direction.set(0, 0, 1);
  const endPosition = target.clone().addScaledVector(direction.normalize(), viewDistance * distanceFactor);
  const start = { target: controls.target.clone(), position: camera.position.clone(), time: performance.now() };
  if (flight) cancelAnimationFrame(flight);
  const step = now => {
    const t = Math.min(1, (now - start.time) / duration), ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    controls.target.lerpVectors(start.target, target, ease);
    camera.position.lerpVectors(start.position, endPosition, ease);
    controls.update();
    flight = t < 1 ? requestAnimationFrame(step) : null;
  };
  flight = requestAnimationFrame(step);
}

// 從指定相機（顯示座標）渲染一張指定大小的圖，回傳 PNG Blob。用來跟原始照片同角度比較。
async function snapshotFromCamera({ position, target, up, fov, width, height }) {
  const shot = new THREE.PerspectiveCamera(fov, width / height, camera.near, camera.far);
  shot.position.set(...position); shot.up.set(...up); shot.lookAt(new THREE.Vector3(...target)); shot.updateMatrixWorld();
  const previous = renderer.getSize(new THREE.Vector2()), ratio = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(width, height, false);
  renderer.render(scene, shot);
  const blob = await new Promise(resolve => renderer.domElement.toBlob(resolve, 'image/png'));
  renderer.setPixelRatio(ratio); renderer.setSize(previous.x, previous.y, false);
  return blob;
}

// 點到哪個圖釘（學習頁用）：回傳圖釘的代碼
function pinAt(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObjects(pinGroup.children, false)[0]?.object.userData.code || '';
}

function setMaterialMode(model, mode, opacity) {
  for (const entry of model.meshes) {
    let material = entry.materials[mode];
    if (!material) {
      const originalMap = (Array.isArray(entry.original) ? entry.original[0] : entry.original)?.map || null;
      const vertexColors = !!entry.mesh.geometry.getAttribute('color'); // 攝影測量也可能用頂點色而不是貼圖
      if (mode === 'lit') material = entry.original;
      else if (mode === 'unlit') { material = new THREE.MeshBasicMaterial({ map: originalMap, vertexColors, color: originalMap || vertexColors ? 0xffffff : BONE_COLOR }); material.toneMapped = false; }
      else material = new THREE.MeshStandardMaterial({ color: BONE_COLOR, roughness: 0.68, metalness: 0 });
      entry.materials[mode] = material;
    }
    for (const item of Array.isArray(material) ? material : [material]) {
      // 攝影測量的 unlit 材質（貼圖已含光影）不要再套色調映射，否則照片色會偏灰
      if (item.isMeshBasicMaterial) item.toneMapped = false;
      item.side = THREE.DoubleSide;
      item.transparent = opacity < 0.999; item.opacity = opacity; item.depthWrite = opacity >= 0.72;
      item.needsUpdate = true;
    }
    entry.mesh.material = material;
  }
}

function clearOverlay(group) {
  while (group.children.length) {
    const child = group.children[group.children.length - 1];
    group.remove(child); // CSS2DObject 被移除時才會把自己的 DOM 元素拿掉
    if (child.isLine || child.isMesh) { if (child.geometry !== pinGeometry) child.geometry?.dispose(); child.material?.dispose(); }
  }
}

// pins：[{code, position:[x,y,z]（輸出座標）, normal, active}]
function drawPins(pins, radius, showLabels) {
  clearOverlay(pinGroup); clearOverlay(labelGroup);
  for (const pin of pins) {
    const color = pin.active ? PIN_ACTIVE : PIN_COLOR;
    const sphere = new THREE.Mesh(pinGeometry, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: pin.active ? 0.5 : 0.28, roughness: 0.3 }));
    sphere.scale.setScalar(radius * (pin.active ? 1.3 : 1));
    sphere.position.set(...pin.position);
    sphere.userData.code = pin.code;
    pinGroup.add(sphere);
    if (!showLabels) continue;
    const element = document.createElement('div');
    element.className = `pinLabel${pin.active ? ' active' : ''}`;
    element.textContent = pin.code;
    const label = new CSS2DObject(element);
    label.position.set(pin.position[0], pin.position[1] + radius * 2.2, pin.position[2]);
    label.userData = { anchor: new THREE.Vector3(...pin.position), normal: pin.normal ? new THREE.Vector3(...pin.normal) : null };
    labelGroup.add(label);
  }
}

// lines：[{from, to, kind: 'calibration' | 'measure'}]
function drawLines(lines) {
  clearOverlay(lineGroup);
  for (const line of lines) {
    const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...line.from), new THREE.Vector3(...line.to)]);
    const material = line.kind === 'calibration'
      ? new THREE.LineDashedMaterial({ color: LINE_CAL, dashSize: sceneRadius * 0.03, gapSize: sceneRadius * 0.02, depthTest: false, transparent: true })
      : new THREE.LineBasicMaterial({ color: LINE_MEASURE, depthTest: false, transparent: true });
    const object = new THREE.Line(geometry, material);
    if (line.kind === 'calibration') object.computeLineDistances();
    object.renderOrder = 10;
    lineGroup.add(object);
  }
}

// ===== cloud.js =====
// 線上教材（Firebase）：網站根目錄有 config.json（含 firebase 設定）才啟用。
// 權限由 Firestore 規則在伺服器端把關：人人可讀；只有 teachers 名單上的 Google 帳號能新增、修改教材。
// 這裡的 cloud.teacher 只用來決定按鈕顯示，真正能不能寫由規則決定（前端判斷只是介面，不是防線）。
const cloud = { enabled: false, user: null, teacher: false, db: null, auth: null, fs: null, authApi: null, onChange: null };
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
let cloudReady = null;
const initCloudOnce = () => cloudReady || (cloudReady = initCloud()); // 兩頁共用，只初始化一次

async function initCloud() {
  if (!location.protocol.startsWith('http')) return cloud;
  let config = null;
  try {
    const response = await fetch('config.json', { cache: 'no-store' });
    if (response.ok) config = (await response.json())?.firebase || null;
  } catch { /* 沒有設定檔＝不啟用線上教材 */ }
  if (!config?.apiKey) return cloud;
  try {
    const [appApi, authApi, fs] = await Promise.all([
      import(`${FIREBASE_SDK}firebase-app.js`), import(`${FIREBASE_SDK}firebase-auth.js`), import(`${FIREBASE_SDK}firebase-firestore.js`)]);
    const app = appApi.initializeApp(config);
    Object.assign(cloud, { enabled: true, auth: authApi.getAuth(app), db: fs.getFirestore(app), fs, authApi });
    authApi.onAuthStateChanged(cloud.auth, async user => {
      cloud.user = user;
      cloud.teacher = user ? await isTeacher(user) : false;
      cloud.onChange?.();
    });
  } catch (error) {
    console.warn('線上教材載入失敗，改用唯讀模式', error);
  }
  return cloud;
}

async function isTeacher(user) {
  try {
    const snap = await cloud.fs.getDoc(cloud.fs.doc(cloud.db, 'teachers', user.email));
    return snap.exists();
  } catch { return false; } // 不在名單上時規則會拒絕讀取，一樣當成不是教學者
}

async function cloudSignIn() {
  const provider = new cloud.authApi.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  await cloud.authApi.signInWithPopup(cloud.auth, provider); // 只用彈出視窗：GitHub Pages 與 Firebase 不同網域，轉址登入在新版瀏覽器會失效
}
async function cloudSignOut() { await cloud.authApi.signOut(cloud.auth); }

// 文件 ID＝模型代號__教材名稱（名稱裡的 / 換成全形，Firestore 的 ID 不能有 /）
const cloudSetId = (modelId, name) => `${modelId}__${String(name).replace(/\//g, '／')}`;

async function listCloudSets(modelId) {
  const { collection, query, where, getDocs } = cloud.fs;
  const snap = await getDocs(query(collection(cloud.db, 'landmarkSets'), where('modelId', '==', modelId)));
  return snap.docs.map(item => {
    const data = item.data();
    // publishedAt 用伺服器時間排「目前版本」，不受教學者電腦時鐘影響
    return { name: data.name, count: data.count, savedAt: data.savedAt, publishedAt: data.updatedAt?.toDate?.()?.toISOString() || data.savedAt,
      annotator: data.updatedBy || '', cloudId: item.id, online: true };
  });
}

async function fetchCloudSet(cloudId) {
  const snap = await cloud.fs.getDoc(cloud.fs.doc(cloud.db, 'landmarkSets', cloudId));
  if (!snap.exists()) throw new Error('線上找不到這份教材（可能剛被刪除）');
  return JSON.parse(snap.data().json);
}

// expectedSavedAt：開啟時那份教材的存檔時間；線上版本比它新，代表別人改過，丟出 CONFLICT，不覆蓋
async function saveCloudSet(modelId, name, doc, expectedSavedAt) {
  const { doc: docRef, collection, runTransaction, serverTimestamp } = cloud.fs;
  const id = cloudSetId(modelId, name);
  const ref = docRef(cloud.db, 'landmarkSets', id);
  await runTransaction(cloud.db, async transaction => {
    const current = await transaction.get(ref);
    if (current.exists() && current.data().savedAt !== (expectedSavedAt || '')) throw new Error('CONFLICT');
    const data = { modelId, name, json: JSON.stringify(doc), count: Object.keys(doc.landmarks || {}).length, savedAt: doc.exportedAt,
      updatedBy: cloud.user.email, updatedAt: serverTimestamp() };
    transaction.set(ref, data);
    transaction.set(docRef(collection(cloud.db, 'landmarkSets', id, 'history')), data); // 每次存檔都留一份歷史，改壞了可以救
  });
  return { cloudId: id, savedAt: doc.exportedAt };
}

// ===== library.js =====
// 模型庫：有本機伺服器（serve.py）時列出模型、讀寫標註檔；放在靜態網站（例如 GitHub Pages）時讀同資料夾的 library.json（唯讀）；
// 直接雙擊 HTML（file://）時退回「開啟檔案」。
const LAST_MODEL_KEY = 'skull-annotator:last-model';
const library = { server: false, static: false, models: [], onPick: null, onOpenFile: null };
const hasCatalog = () => library.server || library.static; // 有模型可挑（本機伺服器或靜態目錄）
const PRESET_LABEL = { skull: '頭骨清單', blank: '自訂點' };
// 每個模型只有一份「目前版本」＝最後存檔的那份（線上版以伺服器時間為準），學習頁只給學生看這份；
// 其他版本自動封存：不刪除，學習頁不列，標註頁收在「封存」裡，教學者打開改好再存，就變成新的目前版本。
const setTime = set => Date.parse(set.publishedAt || set.savedAt || '') || 0;
function markCurrentSets() {
  for (const model of library.models) {
    model.landmarkSets = [...(model.landmarkSets || [])].sort((a, b) => setTime(b) - setTime(a)); // 同時間保留原順序（線上版在前）
    model.landmarkSets.forEach((set, index) => { set.archived = index > 0; });
  }
}
const currentSet = model => model?.landmarkSets?.find(set => !set.archived) || null;

async function loadCatalog() {
  library.server = false;
  library.static = false;
  library.models = [];
  if (!location.protocol.startsWith('http')) return library.models;
  try {
    const response = await fetch('/api/models', { cache: 'no-store' });
    const models = response.ok ? await response.json() : null;
    if (Array.isArray(models)) { library.models = models; library.server = true; markCurrentSets(); return library.models; }
  } catch { /* 沒有本機伺服器 */ }
  try { // 靜態網站：library.json 列出模型檔與唯讀的標註檔（相對路徑）
    const response = await fetch('library.json', { cache: 'no-store' });
    const models = response.ok ? await response.json() : null;
    if (Array.isArray(models)) { library.models = models; library.static = true; }
  } catch { /* 也沒有靜態目錄 */ }
  if (library.static) await mergeCloudSets();
  markCurrentSets();
  return library.models;
}

// 線上教材（Firebase）併進模型庫；同名時以線上版為準（線上版才是教學者最新存的）
async function mergeCloudSets() {
  await initCloudOnce();
  if (!cloud.enabled) return;
  await Promise.all(library.models.map(async model => {
    try {
      const online = await listCloudSets(model.id);
      model.landmarkSets = [...online, ...model.landmarkSets.filter(set => !online.some(item => item.name === set.name))];
    } catch (error) { console.warn('讀取線上教材失敗', error); }
  }));
}

async function apiJson(response) {
  let payload = null;
  try { payload = await response.json(); } catch { /* 伺服器沒回 JSON */ }
  if (!response.ok) throw new Error(payload?.error || `伺服器回應 ${response.status}`);
  return payload;
}
// 靜態網站的模型可能有兩個來源（CDN＋網站本身）：第一個 15 秒沒回應或失敗就換下一個
async function fetchModelBuffer(model) {
  const urls = model.file ? [model.file, model.fallbackFile].filter(Boolean) : [`/api/models/${model.id}/file`];
  let lastError = null;
  for (const url of urls) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000); // 只限「開始回應」前的等待；下載中不中斷
    try {
      const response = await fetch(url, { cache: model.file ? 'default' : 'no-store', signal: controller.signal });
      clearTimeout(timer);
      if (response.ok) return await response.arrayBuffer();
      lastError = new Error(`讀不到模型檔 ${model.fileName}（${response.status}）`);
    } catch (error) {
      clearTimeout(timer);
      lastError = error?.name === 'AbortError' ? new Error(`讀取模型檔 ${model.fileName} 逾時`) : error;
    }
  }
  throw lastError;
}
async function fetchLandmarkSet(model, name) {
  const set = model.landmarkSets.find(item => item.name === name);
  if (set?.cloudId) return fetchCloudSet(set.cloudId);
  if (set?.file) return apiJson(await fetch(set.file, { cache: 'no-store' }));
  return apiJson(await fetch(`/api/models/${model.id}/landmarks/${encodeURIComponent(name)}`, { cache: 'no-store' }));
}
async function saveLandmarkSet(model, name, doc, expectedSavedAt) {
  return apiJson(await fetch(`/api/models/${model.id}/landmarks/${encodeURIComponent(name)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Expected-Saved-At': expectedSavedAt || '' }, body: JSON.stringify(doc),
  }));
}
function rememberModel(model, setName = '') {
  try { localStorage.setItem(LAST_MODEL_KEY, JSON.stringify({ id: model.id, setName })); } catch { /* 記不住也沒關係 */ }
}
function lastModel() {
  try {
    const last = JSON.parse(localStorage.getItem(LAST_MODEL_KEY) || 'null');
    const model = library.models.find(item => item.id === last?.id);
    return model ? { model, setName: last.setName || '' } : null;
  } catch { return null; }
}

function formatSavedAt(value) {
  if (!value) return '';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? '' : `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
}

// 教材按鈕：名稱、點數、存檔時間；markCurrent＝標註頁標出目前版本
const setChip = (set, markCurrent = false) => `<button class="chip${set.archived ? ' archivedChip' : ''}" data-set="${escapeHtml(set.name)}" title="${escapeHtml(set.annotator ? `標註者：${set.annotator}` : '')}">${escapeHtml(set.name)} · ${set.count} 點${setTime(set) ? ` · ${formatSavedAt(set.publishedAt || set.savedAt)}` : ''}${set.online ? ' · 線上' : ''}${markCurrent ? ' · 目前版本' : ''}</button>`;

// currentId：目前開著的模型；requireSets：學習頁用，只列出有教材的模型，而且每個模型只列目前版本
function renderLibrary(currentId = '', { requireSets = false } = {}) {
  const list = $('libraryList');
  const models = requireSets ? library.models.filter(model => model.landmarkSets.length) : library.models;
  $('librarySubtitle').textContent = library.server
    ? `本機伺服器找到 ${library.models.length} 個模型；雲端 vault 的「模型／」與本機私人資料夾（~/skull3d/models）都會列出來。每個模型以最後存檔的標註為目前版本，其他收在「封存」。`
    : library.static
      ? cloud.enabled
        ? `網頁版模型庫：${library.models.length} 個模型。學生只看得到每個模型的「目前版本」（最後存檔的那份）；教學者登入後「存到網站」，那一版就成為目前版本，其他版本自動封存。`
        : `網頁版模型庫：${library.models.length} 個模型。標註只存在這台瀏覽器的草稿，要留存請按「存成 JSON」下載檔案。`
      : '現在是直接開檔（file://），看不到模型庫：請按下方「開啟電腦裡的檔案」，或雙擊「啟動標註器.bat」改用模型庫。';
  if (!models.length) {
    list.innerHTML = `<p class="note">${library.server ? (requireSets ? '還沒有任何標好的教材：先到標註頁標好並「存成 JSON」。' : '模型庫是空的：把 .glb 放進 vault 的「模型／」或 ~/skull3d/models。')
      : library.static ? (requireSets ? '網頁版還沒有標好的教材：可按下方「開啟電腦裡的檔案」開模型，再開下載的標註 JSON。' : '網頁版模型庫是空的。') : ''}</p>`;
    return;
  }
  list.innerHTML = models.map(model => {
    const current = model.landmarkSets.filter(set => !set.archived), archived = model.landmarkSets.filter(set => set.archived);
    return `
    <div class="modelCard${model.id === currentId ? ' active' : ''}" data-model="${escapeHtml(model.id)}" role="button" tabindex="0">
      <div class="modelTop"><b>${escapeHtml(model.title)}</b>
        <span class="badge">${model.source === 'local' ? '本機私人（不同步）' : model.source === 'web' ? '網頁版' : '雲端 vault'}</span>
        ${model.sensitive ? '<span class="badge warnBadge">大體老師資料</span>' : ''}</div>
      ${model.description ? `<p>${escapeHtml(model.description)}</p>` : ''}
      <small>${escapeHtml(model.fileName)} · ${model.sizeMB} MB · ${PRESET_LABEL[model.preset] || model.preset}${requireSets ? '' : ` · ${model.landmarkSets.length} 份標註${archived.length ? `（${archived.length} 份封存）` : ''}`}</small>
      ${current.length ? `<div class="setChips">${current.map(set => setChip(set, !requireSets)).join('')}</div>` : ''}
      ${!requireSets && archived.length ? `<details class="archivedSets"><summary>封存 ${archived.length} 份：學生看不到；打開改好再存，就會變成目前版本</summary>
        <div class="setChips">${archived.map(set => setChip(set)).join('')}</div></details>` : ''}
    </div>`;
  }).join('');
  list.querySelectorAll('.modelCard').forEach(card => {
    const model = library.models.find(item => item.id === card.dataset.model);
    card.onclick = event => {
      const chip = event.target.closest('[data-set]');
      if (!chip && event.target.closest('details')) return; // 只是展開／收合封存清單，不開模型
      closeLibrary();
      library.onPick?.(model, chip ? chip.dataset.set : '');
    };
    card.onkeydown = event => { if (event.key === 'Enter') card.click(); };
  });
}

function openLibrary(currentId = '', options = {}) {
  renderLibrary(currentId, options);
  $('libraryModal').classList.remove('hidden');
}
function closeLibrary() { $('libraryModal').classList.add('hidden'); }

function bindLibraryModal() {
  $('libraryClose').onclick = closeLibrary;
  $('libraryModal').onclick = event => { if (event.target === $('libraryModal')) closeLibrary(); };
  $('libraryOpenFile').onclick = () => { closeLibrary(); library.onOpenFile?.(); };
  $('libraryRefresh').onclick = async () => { await loadCatalog(); renderLibrary(); toast(`模型庫已更新：${library.models.length} 個模型`); };
}
