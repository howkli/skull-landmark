<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>頭骨 Landmark 標註</title>
<style>:root {
  --bg: #e7eceb; --panel: #ffffff; --ink: #1d2624; --muted: #5f6d6a; --line: #d6dedc; --soft: #f3f6f5;
  --accent: #0d9bb5; --accent-soft: #e2f4f7; --pin: #e65d32; --cal: #7b5cd6;
  --warn: #b3541e; --warn-soft: #fcefe6; --bad: #b42318; --ok: #1a7a3e;
  --radius: 8px; --shadow: 0 6px 22px rgba(20, 40, 38, .14);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
.topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: #fff; font-weight: 700; letter-spacing: .5px; flex: none; }
.brandText { display: flex; flex-direction: column; min-width: 0; }
.brandText strong { font-size: 15px; }
.brandText small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
.tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: #aebbb8; background: var(--soft); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #33403d; }
.btn.place { border-color: var(--accent); color: #07667a; background: var(--accent-soft); }
.btn.add { border-style: dashed; }
.btn.danger { color: var(--bad); }
.linkBtn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
.linkBtn:hover { color: var(--bad); }
.fileTarget { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.fileTarget span { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.fileTarget input { border: 0; padding: 5px 8px; width: 120px; outline: none; }
.fileTarget b { font-weight: 400; color: var(--muted); padding-right: 8px; }
.saveState { font-size: 12px; color: var(--ok); min-width: 120px; }
.saveState.dirty { color: var(--warn); }

.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 390px; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.stage.dragging::after { content: "放開就載入"; position: absolute; inset: 12px; border: 3px dashed var(--accent); border-radius: 14px; display: grid; place-items: center; font-size: 20px; color: #07667a; background: rgba(226, 244, 247, .7); pointer-events: none; }
#viewer { position: absolute; inset: 0; }
#viewer canvas { display: block; width: 100%; height: 100%; }
.labelLayer { position: absolute; inset: 0; pointer-events: none; }
.pinLabel { font: 600 11px/1.2 ui-monospace, Consolas, monospace; color: #8a3a1c; background: rgba(255, 255, 255, .86); border: 1px solid rgba(230, 93, 50, .35); padding: 1px 4px; border-radius: 4px; white-space: nowrap; }
.pinLabel.active { color: #07667a; border-color: rgba(13, 155, 181, .6); }
.pinLabel.behind { opacity: .16; }
select.btn { padding: 5px 8px; }
.annotatorRow select { flex: 1; border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; min-width: 0; }

.views { position: absolute; top: 12px; left: 12px; display: flex; gap: 4px; background: rgba(255, 255, 255, .92); padding: 4px; border-radius: 9px; box-shadow: var(--shadow); }
.views button { border: 0; background: none; width: 34px; height: 30px; border-radius: 6px; cursor: pointer; }
.views button:hover { background: var(--accent-soft); }
.displayControls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; background: rgba(255, 255, 255, .94); padding: 10px 12px; border-radius: 9px; box-shadow: var(--shadow); font-size: 12.5px; }
.displayControls label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.displayControls input[type=range] { width: 110px; }
.displayControls select { padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; }
.check { display: flex; align-items: center; gap: 6px; }
.frameBadge { position: absolute; left: 12px; top: 56px; display: flex; gap: 10px; align-items: center; background: rgba(255, 255, 255, .92); padding: 5px 10px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow); }
.warnText { color: var(--warn); font-weight: 600; }
.stageHint { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: center; background: rgba(29, 38, 36, .82); color: #fff; padding: 8px 12px; border-radius: 9px; font-size: 12.5px; }
.stageHint b { white-space: nowrap; }
.stageHint.placing { background: rgba(7, 102, 122, .9); }
.dropzone, .loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.dropzone > div, .loading > div { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; max-width: 380px; background: rgba(255, 255, 255, .95); padding: 22px 26px; border-radius: 14px; box-shadow: var(--shadow); }
.dropzone b { font-size: 17px; }
.dropzone small, .loading small { color: var(--muted); }
.loading { background: rgba(231, 236, 235, .55); pointer-events: auto; }
.loading.error b { color: var(--bad); }

.panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 6px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabPane { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px 16px; }
#tab-landmarks { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.annotatorRow { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.annotatorRow input { flex: 1; border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
.progressHead { display: flex; justify-content: space-between; font-size: 13px; }
.progressTrack { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; flex: none; }
.progressTrack i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.list { flex: 1; min-height: 120px; overflow: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 2px; }
.landmark { display: grid; grid-template-columns: 28px minmax(0, 1fr) 20px; align-items: center; gap: 8px; text-align: left; border: 1px solid transparent; background: var(--soft); border-radius: 7px; padding: 5px 8px; cursor: pointer; }
.landmark:hover { border-color: var(--line); }
.landmark.active { border-color: var(--accent); background: var(--accent-soft); }
.landmark .num { color: var(--muted); font-size: 12px; text-align: right; }
.landmark .label { display: flex; flex-direction: column; min-width: 0; }
.landmark .label b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.landmark .label small { color: var(--muted); font-size: 11.5px; }
.landmark .check { color: var(--muted); text-align: center; }
.landmark.done .check { color: var(--ok); font-weight: 700; }
.current { flex: none; border-top: 1px solid var(--line); padding-top: 10px; }
.currentHead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.badge { font-size: 11.5px; background: var(--soft); border-radius: 99px; padding: 1px 8px; color: var(--muted); white-space: nowrap; }
.description { margin: 6px 0; font-size: 13px; color: #33403d; }
.caution { margin: 6px 0; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); padding: 5px 8px; border-radius: 6px; }
.coords { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; }
.coords div { background: var(--soft); border-radius: 6px; padding: 3px 6px; display: flex; gap: 6px; font-size: 12px; }
.coords span { color: var(--muted); }
.meta { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.currentActions { display: flex; gap: 6px; flex-wrap: wrap; }

.calSection { border-top: 1px solid var(--line); padding: 10px 0 4px; }
.calSection:first-child { border-top: 0; padding-top: 0; }
.calSection h3 { font-size: 14px; margin: 0 0 4px; }
.note { font-size: 12.5px; color: var(--muted); margin: 4px 0 8px; }
.summary { font-size: 13px; margin: 6px 0; }
.muted { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 4px; }
td { border-bottom: 1px solid var(--soft); padding: 5px 4px; vertical-align: top; }
td small { display: block; color: var(--muted); font-size: 11px; }
td.value { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.measure tbody tr { cursor: pointer; }
table.measure tbody tr:hover { background: var(--soft); }
table.measure tr.highlight { background: var(--accent-soft); }
.pairForm, .measureForm { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.pairForm select, .measureForm select, .measureForm input, .pairForm input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; }
.pairForm select { flex: 1 1 120px; }
.pairForm input { width: 90px; }
.measureForm input, .measureForm select { flex: 1 1 140px; }
.fhRow { display: grid; grid-template-columns: 72px minmax(0, 1fr) 44px; gap: 6px; align-items: center; margin: 4px 0; font-size: 13px; }
.fhRow select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; min-width: 0; }
.fhRow i { font-style: normal; font-size: 12px; text-align: center; }
.fhRow i.ok { color: var(--ok); }
.fhRow i.miss { color: var(--warn); }
#toggleAlign { margin: 6px 0; }

.toast { position: fixed; left: 50%; bottom: 78px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 9px; box-shadow: var(--shadow); transition: .2s; pointer-events: none; max-width: 80vw; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.warn { background: var(--warn); }
.toast.bad { background: var(--bad); }
.modal { position: fixed; inset: 0; background: rgba(20, 30, 28, .38); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modalCard { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); width: min(560px, 100%); padding: 16px 18px; }
.modalHead { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.modalHead > div { display: flex; flex-direction: column; }
.modalHead small { color: var(--muted); font-size: 12px; }
.modalHead button { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
.formGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.formGrid label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.formGrid label.wide { grid-column: 1 / -1; }
.formGrid input, .formGrid select, .formGrid textarea { border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
.formGrid small { color: var(--muted); font-size: 11.5px; }
.modalActions { display: flex; gap: 8px; margin-top: 14px; }
.modalActions span { flex: 1; }

.presetNotice { font-size: 12.5px; background: var(--accent-soft); color: #07667a; border-radius: 8px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }

/* 頁面切換與模型庫（兩頁共用） */
.pageNav { display: flex; gap: 2px; background: var(--soft); padding: 3px; border-radius: 9px; }
.pageNav a { padding: 4px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 13.5px; }
.pageNav a.active { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(20, 40, 38, .15); }
.pageNav a:hover:not(.active) { color: var(--ink); }
.modalCard.wideCard { width: min(760px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
.libraryList { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; overflow: auto; padding: 2px; }
.modelCard { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.modelCard:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(13, 155, 181, .12); }
.modelCard.active { border-color: var(--accent); background: var(--accent-soft); }
.modelCard p { margin: 0; font-size: 13px; color: #33403d; }
.modelCard small { color: var(--muted); font-size: 12px; }
.modelTop { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.modelTop b { font-size: 14.5px; margin-right: 4px; }
.warnBadge { background: var(--warn-soft); color: var(--warn); }
.setChips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--accent); color: #07667a; background: var(--panel); border-radius: 99px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.chip:hover { background: var(--accent-soft); }
.archivedSets { font-size: 12px; color: var(--muted); }
.archivedSets summary { cursor: pointer; margin-bottom: 6px; }
.chip.archivedChip { border-color: var(--line); color: var(--muted); }
.sensitiveBanner { position: absolute; bottom: 64px; left: 12px; background: rgba(179, 84, 30, .92); color: #fff; padding: 4px 12px; border-radius: 8px; font-size: 12px; box-shadow: var(--shadow); z-index: 2; max-width: calc(100% - 24px); }

/* 觸控裝置（手機、平板）：提示改觸控用語 */
.hintTouch { display: none; }
@media (pointer: coarse) { .hintMouse { display: none; } .hintTouch { display: inline; } }
/* 外觀設定：桌面版一直展開；手機版收成一顆按鈕 */
.displayToggle { display: none; }

@media (max-width: 900px) {
  .workspace { grid-template-columns: 1fr; grid-template-rows: 62vh auto; overflow: auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); min-height: 60vh; }
  .displayControls { top: auto; bottom: 110px; }
  .tools { margin-left: 0; }
}

/* 手機（寬度 600px 以下）：工具列精簡、3D 畫面放大、外觀設定收合 */
@media (max-width: 600px) {
  .topbar { gap: 8px; padding: 6px 10px; }
  .brandText small { max-width: 210px; }
  .tools { gap: 4px; }
  .btn { padding: 4px 8px; font-size: 13px; }
  .workspace { grid-template-rows: 68vh auto; }
  .views button { width: 30px; height: 28px; }
  .displayControls { top: 12px; bottom: auto; right: 8px; padding: 6px 9px; font-size: 12px; }
  .displayToggle { display: block; border: 0; background: none; font: inherit; font-weight: 600; color: inherit; padding: 2px 0; text-align: left; cursor: pointer; }
  .displayControls:not(.open) > label { display: none; }
  .displayControls input[type=range] { width: 80px; }
  .stageHint { left: 8px; right: 8px; bottom: 8px; gap: 8px; padding: 6px 10px; font-size: 12px; }
}
</style>
<script>
  // 模組載不進來（多半是沒網路，three.js 在 jsdelivr）時，至少告訴使用者原因
  window.addEventListener('error', function (event) {
    var box = document.getElementById('loading');
    if (!box) return;
    box.className = 'loading error';
    document.getElementById('loadingText').textContent = '3D 程式載入失敗';
    document.getElementById('loadingDetail').textContent = String(event.message || '') + '（第一次開需要網路下載 three.js）';
  });
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">SK</span><span class="brandText"><strong>頭骨 Landmark 標註</strong><small id="modelName">尚未載入模型</small></span></div>
    <nav class="pageNav" aria-label="切換頁面"><a class="active" href="標註.html">標註</a><a href="學習.html">學習</a></nav>
    <div class="tools">
      <button class="btn primary" id="openModel">開啟模型</button><input id="modelFile" class="hidden" type="file" accept=".glb,.gltf,model/gltf-binary">
      <label class="fileTarget">檔名 <span><input id="setName" maxlength="80" value="skull" aria-label="標註檔名"><b>.json</b></span></label>
      <button class="btn" id="importJson">匯入 JSON</button><input id="importFile" class="hidden" type="file" accept="application/json,.json">
      <button class="btn add" id="addLandmark">＋ 新增 Landmark</button>
      <button class="btn place" id="place">停止標註</button>
      <button class="btn" id="undo" disabled>復原</button>
      <select class="btn" id="exportMenu" aria-label="匯出"><option value="">匯出…</option><option value="json">JSON（下載）</option><option value="csv">CSV（R／Excel）</option><option value="slicer">3D Slicer（.mrk.json）</option></select>
      <button class="btn primary" id="save">存成 JSON</button>
      <button class="btn hidden" id="cloudLogin">教學者登入</button>
      <span class="saveState" id="saveState">尚未載入模型</span>
    </div>
  </header>
  <main class="workspace">
    <section class="stage" id="stage">
      <div id="viewer" aria-label="3D 模型"></div>
      <div class="views" aria-label="切換視角">
        <button data-view="front" title="正面 norma frontalis">前</button><button data-view="back" title="後面 norma occipitalis">後</button><button data-view="left" title="左側面 norma lateralis">左</button><button data-view="right" title="右側面">右</button><button data-view="top" title="上面 norma verticalis">上</button><button data-view="bottom" title="底面 norma basilaris">下</button>
      </div>
      <div class="sensitiveBanner hidden" id="sensitiveBanner">大體老師資料：僅限教學使用，請勿截圖外流或上傳到雲端與社群</div>
      <div class="frameBadge hidden" id="frameBadge"></div>
      <div class="loading hidden" id="loading"><div><b id="loadingText">載入中…</b><small id="loadingDetail"></small><button class="btn hidden" id="loadingClose">關閉</button></div></div>
      <div class="displayControls" id="displayControls">
        <button class="displayToggle" id="displayToggle" type="button" aria-expanded="false">外觀設定 ▾</button>
        <label>外觀 <select id="displayMode"><option value="lit">照片貼圖</option><option value="unlit">貼圖原色（無光影）</option><option value="plain">素色骨頭</option></select></label>
        <label>透明度 <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="1"></label>
        <label>標記大小 <input id="pinScale" type="range" min="0.3" max="3" step="0.1" value="1"></label>
        <label class="check"><input id="labels" type="checkbox" checked> 顯示代碼</label>
      </div>
      <div class="stageHint" id="stageHint"><b id="modeLabel">標註模式</b><span id="hintText"></span></div>
      <div class="dropzone" id="dropzone"><div><b>選一個模型開始</b><small>按左上「模型庫」或「開啟模型」，也可以把 .glb 直接拖進來。之前標過的同一個模型，會自動接回這台瀏覽器的草稿。</small></div></div>
    </section>
    <aside class="panel">
      <nav class="tabs"><button data-tab="landmarks" class="active">Landmark</button><button data-tab="calib">校正與擺正</button><button data-tab="measure">量測</button></nav>
      <section class="tabPane" id="tab-landmarks">
        <label class="annotatorRow">清單 <select id="preset"></select></label>
        <label class="annotatorRow">標註者 <input id="annotator" maxlength="40" placeholder="姓名或代號（寫進 JSON，算觀察者間誤差用）"></label>
        <div class="presetNotice hidden" id="presetNotice"></div>
        <div class="progressHead"><strong>進度</strong><span id="count">0 / 0</span></div>
        <div class="progressTrack"><i id="progress"></i></div>
        <div class="list" id="list"></div>
        <section class="current" id="current"></section>
      </section>
      <section class="tabPane hidden" id="tab-calib"></section>
      <section class="tabPane hidden" id="tab-measure"></section>
    </aside>
  </main>
</div>
<div class="modal hidden" id="libraryModal" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
  <div class="modalCard wideCard">
    <div class="modalHead"><div><strong id="libraryTitle">選擇模型</strong><small id="librarySubtitle"></small></div><button type="button" id="libraryClose" aria-label="關閉">×</button></div>
    <p class="note">點卡片開模型；點卡片裡的標註名稱，會連同那份標註一起開。</p>
    <div class="libraryList" id="libraryList"></div>
    <div class="modalActions"><button type="button" class="btn" id="libraryOpenFile">開啟電腦裡的檔案…</button><span></span><button type="button" class="btn" id="libraryRefresh">重新整理清單</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal hidden" id="landmarkModal" role="dialog" aria-modal="true" aria-labelledby="landmarkModalTitle">
  <form class="modalCard" id="landmarkForm">
    <div class="modalHead"><div><strong id="landmarkModalTitle">新增 Landmark</strong><small>名稱可以留白；代碼是連接座標的鑰匙，建立後不能改。</small></div><button type="button" id="cancelAddTop" aria-label="關閉">×</button></div>
    <div class="formGrid">
      <label><span>名稱</span><input id="newName" maxlength="120" placeholder="例如：鼻根點 nasion、正中神經"></label>

// ===== geometry.js =====
// 頭骨標註器的純數學：重心座標、法蘭克福座標系、比例校正、量測、網格雜湊。
// 刻意不碰 three.js，才能用 node 直接測（tests/geometry.test.mjs）。
// 座標一律是 [x, y, z] 陣列；矩陣一律是列優先的 4×4 巢狀陣列。

const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => Math.hypot(a[0], a[1], a[2]);
const distance = (a, b) => norm(sub(a, b));

function normalize(a) {
  const n = norm(a);
  if (!(n > 1e-12)) throw new Error('向量長度為零，無法定方向');
  return mul(a, 1 / n);
}

// 與 8078 的 barycentricForHit 同一套：投影到三角形平面，負值截成 0 再重新正規化。
// 退化判準改成相對值：8078 用 mm 座標、門檻 1e-12 沒問題，但照片重建的模型常是公尺，
// 百萬面等級的小三角形 den 會小於 1e-12 而被誤判成退化。
function barycentric(p, a, b, c) {
  const v0 = sub(b, a), v1 = sub(c, a), v2 = sub(p, a);
  const d00 = dot(v0, v0), d01 = dot(v0, v1), d11 = dot(v1, v1), d20 = dot(v2, v0), d21 = dot(v2, v1);
  const den = d00 * d11 - d01 * d01;
  if (!(d00 > 0) || !(d11 > 0) || Math.abs(den) <= 1e-12 * d00 * d11) return [1, 0, 0];
  const v = (d11 * d20 - d01 * d21) / den, w = (d00 * d21 - d01 * d20) / den, u = 1 - v - w;
  const clipped = [Math.max(0, u), Math.max(0, v), Math.max(0, w)];
  const sum = clipped[0] + clipped[1] + clipped[2];
  return sum > 0 ? clipped.map(value => value / sum) : [1, 0, 0];
}

function fromBarycentric(a, b, c, weights) {
  const [u, v, w] = weights;
  return [a[0] * u + b[0] * v + c[0] * w, a[1] * u + b[1] * v + c[1] * w, a[2] * u + b[2] * v + c[2] * w];
}

// 法蘭克福水平面座標系。輸入是模型座標的左右 porion 與一側 orbitale。
// 輸出軸（右手座標）：+X 往受試者左側、+Y 往上、+Z 往前；原點在兩側 porion 中點。
// FH 平面就是 Y = 0；X = 0 是通過 porion 中點、垂直於耳點連線的近似正中矢狀面。
function frankfurtFrame(poL, poR, orbitale) {
  const origin = mul(add(poL, poR), 0.5);
  const x = normalize(sub(poL, poR));
  const toOrbitale = sub(orbitale, origin);
  const forward = sub(toOrbitale, mul(x, dot(toOrbitale, x)));
  if (norm(forward) < 1e-9 * Math.max(1, norm(toOrbitale))) throw new Error('orbitale 幾乎落在兩側 porion 的連線上，無法定出平面');
  const z = normalize(forward);
  const y = cross(z, x);
  return { origin, x, y, z };
}

// 輸出 = scale · R · (p − origin)，R 的三列是 frame 的 x、y、z 軸。沒有 frame 時只做等比縮放。
function makeTransform(scale, frame = null) {
  if (!frame) return [[scale, 0, 0, 0], [0, scale, 0, 0], [0, 0, scale, 0], [0, 0, 0, 1]];
  const row = axis => [...mul(axis, scale), -scale * dot(axis, frame.origin)];
  return [row(frame.x), row(frame.y), row(frame.z), [0, 0, 0, 1]];
}

function applyTransform(m, p) {
  return [0, 1, 2].map(i => m[i][0] * p[0] + m[i][1] * p[1] + m[i][2] * p[2] + m[i][3]);
}

// 游標卡尺校正：每組是「模型上兩點的距離」對「實物量到的 mm」。
// 最小平方的等比係數 s = Σ m·d / Σ d²；residuals 與輸入同序（無效的一組回 null）。
function fitScale(pairs) {
  const valid = pairs.filter(pair => pair.modelDistance > 0 && pair.measuredMm > 0);
  if (!valid.length) return null;
  const num = valid.reduce((total, pair) => total + pair.measuredMm * pair.modelDistance, 0);
  const den = valid.reduce((total, pair) => total + pair.modelDistance * pair.modelDistance, 0);
  const factor = num / den;
  const residuals = pairs.map(pair => (pair.modelDistance > 0 && pair.measuredMm > 0) ? factor * pair.modelDistance - pair.measuredMm : null);
  const used = residuals.filter(value => value !== null);
  const rms = Math.sqrt(used.reduce((total, value) => total + value * value, 0) / used.length);
  return { factor, residuals, rms, n: valid.length };
}

function angleDeg(a, vertex, c) {
  const u = sub(a, vertex), v = sub(c, vertex), nu = norm(u), nv = norm(v);
  if (!(nu > 1e-12) || !(nv > 1e-12)) return NaN;
  return Math.acos(Math.min(1, Math.max(-1, dot(u, v) / (nu * nv)))) * 180 / Math.PI;
}

// 網格指紋：cyrb53 的兩條 32 位元雜湊逐位元組處理，輸出 16 位 hex。
// 只用來確認「JSON 是不是這個網格標的」（跟 8078 的 templateGeometryHash 同用途），不是密碼學用途。
function hashChunks(chunks, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (const chunk of chunks) {
    const bytes = chunk instanceof Uint8Array ? chunk : new Uint8Array(chunk.buffer, chunk.byteOffset, chunk.byteLength);
    for (let i = 0; i < bytes.length; i++) {
      h1 = Math.imul(h1 ^ bytes[i], 2654435761);
      h2 = Math.imul(h2 ^ bytes[i], 1597334677);
    }
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}

// 四捨五入到固定小數位，避免 JSON 裡出現 0.30000000000000004 這種雜訊。
